<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d1f23;--mut:#6b6f76;--line:#e4e0d6;--acc:#2f5bd3;--acc2:#e9efff;--ok:#1d8a4e;--okb:#e5f5ec;--no:#c43b2f;--nob:#fbe9e7;--hl:#fff3c4;--chip:#efece4}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121316;--card:#1b1d21;--ink:#ecebe7;--mut:#9a9ea6;--line:#2c2f35;--acc:#7c9cff;--acc2:#1f2740;--ok:#4cc985;--okb:#173326;--no:#ff7b6e;--nob:#3a1f1c;--hl:#3b3418;--chip:#24262b}}
:root[data-theme=dark]{--bg:#121316;--card:#1b1d21;--ink:#ecebe7;--mut:#9a9ea6;--line:#2c2f35;--acc:#7c9cff;--acc2:#1f2740;--ok:#4cc985;--okb:#173326;--no:#ff7b6e;--nob:#3a1f1c;--hl:#3b3418;--chip:#24262b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;border-bottom:1px solid var(--line)}
header .t{display:flex;align-items:center;gap:8px}header h1{font-size:17px;margin:0;flex:1;letter-spacing:-.2px}
header .sub{font-size:12px;color:var(--mut)}
.ib{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:12px 16px calc(90px + env(safe-area-inset-bottom))}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:11.5px;padding:8px 0 9px;display:grid;justify-items:center;gap:1px;cursor:pointer}
nav button b{font-size:19px;line-height:1.2;font-weight:400}nav button.on{color:var(--acc);font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13.5px;cursor:pointer}.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.list .card{display:flex;gap:12px;align-items:center;cursor:pointer;padding:12px 14px}
.nb{flex:none;width:44px;height:44px;border-radius:12px;background:var(--acc2);color:var(--acc);display:grid;place-items:center;font-weight:800;font-size:13px;line-height:1.1;text-align:center}
.nb small{display:block;font-size:10px;font-weight:600;opacity:.8}
.li{flex:1;min-width:0}.li b{display:block;font-size:15px}.li span{display:block;font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}.dot.d{background:var(--ok)}
h2{font-size:19px;margin:4px 0 2px}h3{font-size:14px;margin:0 0 8px;color:var(--acc);letter-spacing:.2px}
.mut{color:var(--mut)}.sm{font-size:13px}
ul.k{margin:0;padding-left:18px}ul.k li{margin:3px 0}
.pair{display:grid;gap:8px}.pair div{border-left:3px solid var(--acc);padding:2px 0 2px 10px}.pair i{display:block;font-style:normal;font-size:13.5px;color:var(--mut)}
.mem{background:var(--hl);border-radius:10px;padding:10px 12px;margin-bottom:8px}.mem .ko{font-size:13.5px;color:var(--mut);margin-top:4px}
.gr{display:grid;gap:6px}.gr div{font-size:14px}.gr code{font:inherit;font-weight:700;background:var(--chip);border-radius:6px;padding:1px 6px}
.sent{padding:6px 0;border-bottom:1px dashed var(--line)}.sent:last-child{border:0}.sent .n{color:var(--acc);font-weight:700;margin-right:4px}
.sent.m{background:var(--hl);border-radius:8px;padding:6px 8px;border-bottom:0;margin:2px -8px}
.sent .ko{font-size:13.5px;color:var(--mut);display:none;margin-top:2px}.showko .sent .ko{display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;font-size:15px;background:var(--acc);color:#fff;cursor:pointer}.btn.g{background:var(--chip);color:var(--ink)}.btn.w{width:100%}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.lv button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 4px;font:inherit;cursor:pointer;text-align:center}

.qh{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-bottom:6px}
.bar{height:5px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:var(--acc)}
.qq{font-weight:700;margin:2px 0 10px}
.psg{font-size:15px;line-height:1.75;background:var(--bg);border-radius:10px;padding:12px;margin-bottom:12px}
.psg .bk{display:inline-block;min-width:110px;border-bottom:2px solid var(--ink);margin:0 2px}
.psg .gv{display:block;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px;margin-bottom:10px}
.psg .ch{display:block;margin-top:8px}.psg .ch b{color:var(--acc)}
.psg .pt{color:var(--acc);font-weight:800}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px 12px;margin-bottom:8px;font:inherit;font-size:15px;cursor:pointer;line-height:1.5}
.opt .c{color:var(--acc);font-weight:800;margin-right:6px}.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.no{border-color:var(--no);background:var(--nob)}.opt:disabled{cursor:default}
.ex{border-radius:12px;padding:12px;margin:4px 0 12px;font-size:14px}.ex.ok{background:var(--okb)}.ex.no{background:var(--nob)}.ex b{display:block;margin-bottom:4px}
.tok{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;min-height:46px;padding:8px;border:1px dashed var(--line);border-radius:12px}
.tok button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:6px 9px;font:inherit;font-size:14.5px;cursor:pointer}
.tok.ans button{background:var(--acc2);border-color:var(--acc)}
.fc{min-height:220px;display:grid;align-content:center;text-align:center;cursor:pointer;user-select:none}
.fc .src{font-size:12px;color:var(--mut);margin-bottom:8px}.fc .q{font-size:16px}.fc .a{font-size:16.5px;font-weight:600;margin-top:12px;color:var(--acc)}
.fc .tap{font-size:12px;color:var(--mut);margin-top:14px}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.score{text-align:center;padding:24px 10px}.score b{font-size:42px;display:block;color:var(--acc)}
.back{border:0;background:none;color:var(--acc);font:inherit;font-weight:700;padding:4px 0;margin-bottom:6px;cursor:pointer}
.tg{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--acc2);color:var(--acc);margin-right:4px}
</style>

<script>
const D=[{"src": "24년 10월 20번", "en": ["For many of us, making time for exercise is a continuing challenge.", "Between work commitments and family obligations, it often feels like there's no room in our packed schedules for a dedicated workout.", "But what if the workout came to you, right in the midst of your daily routine?", "That's where the beauty of integrating mini-exercises into household chores comes into play.", "Let's be realistic; chores are inevitable.", "Whether it's washing dishes or taking out the trash, these tasks are an essential part of daily life.", "But rather than viewing chores as purely obligatory activities, why not seize these moments as opportunities for physical activity?", "For instance, practice squats or engage in some wall push-ups as you wait for your morning kettle to boil.", "Incorporating quick exercises into your daily chores can improve your health."], "ko": ["우리 중 다수에게 운동할 시간을 내는 것은 계속되는 도전이다.", "업무에 대한 전념과 가족 의무 사이에서, 우리의 빡빡한 일정들에는 운동에 전념할 여유가 없는 것처럼 종종 느껴진다.", "그러나 만약 여러분의 일상 바로 한가운데에서 운동이 여러분을 찾아온다면 어떨까?", "그것이 바로 간단한 운동을 집안일에 통합시키는 아름다움이 작동하는 지점이다.", "현실적이 되자. 집안일은 불가피하다.", "그것이 설거지하는 것이든 쓰레기를 내다 버리는 것이든지 간에, 이런 일들은 일상생활의 필수적인 부분이다.", "하지만 집안일을 순전히 의무적인 행위로 간주하기보다는, 이런 순간들을 신체 활동을 위한 기회로 잘 이용하는 것이 어떨까?", "예를 들어, 여러분의 아침 주전자가 끓기를 기다리면서 스쿼트를 연습하거나 벽에 대고 하는 팔 굽혀 펴기 몇 개를 시작해 보라.", "짧은 운동을 여러분의 일상적인 집안일에 포함시키는 것이 여러분의 건강을 향상시킬 수 있다."], "sum": "바쁜 일상에서 운동 시간을 따로 내기 어렵다면, 피할 수 없는 집안일을 신체 활동의 기회로 삼아 짧은 운동을 함께 하라. 그것이 건강을 향상시킨다.", "key": ["운동할 시간을 내는 것은 계속되는 도전(일·가족 의무로 바쁨)", "집안일은 피할 수 없음 → 의무가 아니라 운동의 기회로 보기", "예: 주전자 물이 끓는 동안 스쿼트·벽 팔굽혀펴기 → 건강 향상"], "mem": [7, 9], "tp": [["integrating mini-exercises into household chores to improve health", "집안일에 짧은 운동을 결합해 건강을 증진하기"], ["turning daily chores into opportunities for physical activity", "일상의 집안일을 신체 활동의 기회로 바꾸기"]], "tt": [["Turn Your Chores into Workouts!", "집안일을 운동으로 바꿔라!"], ["No Time for the Gym? Exercise While You Clean", "헬스장 갈 시간이 없다고? 청소하며 운동하라"]], "bl": [7, "opportunities for physical activity", ["chances to take a rest", "burdens on our schedules", "reasons to hire helpers", "excuses to skip workouts"]], "gr": [["rather than viewing chores as ~, why not seize ~?", "rather than + -ing: ~하기보다는 / why not + 동사원형: ~하는 게 어때?"], ["Incorporating quick exercises ... can improve", "동명사구 주어 → 단수 취급"], ["Whether it's A or B", "A이든 B이든 (양보의 부사절)"]]}, {"src": "24년 10월 21번", "en": ["When we see something, we naturally and automatically break it up into shapes, colors, and concepts that we have learned through education.", "We recode what we see through the lens of everything we know.", "We reconstruct memories rather than retrieving the video from memory.", "This is a useful trait.", "It's a more efficient way to store information — a bit like an optimal image compression algorithm such as JPG, rather than storing a raw bitmap image file.", "People who lack this ability and remember everything in perfect detail struggle to generalize, learn, and make connections between what they have learned.", "But representing the world as abstract ideas and features comes at a cost of seeing the world as it is.", "Instead, we see the world through our assumptions, motivations, and past experiences.", "The discovery that our memories are reconstructed through abstract representations rather than played back like a movie completely undermined the legal primacy of eyewitness testimony.", "Seeing is not believing."], "ko": ["우리가 무언가를 볼 때, 우리는 그것을 자연스럽게 그리고 자동적으로 우리가 교육을 통해 배운 모양, 색깔, 그리고 개념들로 해체한다.", "우리는 우리가 알고 있는 모든 것의 렌즈를 통해 우리가 보는 것을 재부호화한다.", "우리는 기억에서 영상을 생각해 내기보다 기억을 재구성한다.", "이것은 유용한 특성이다.", "그것은 가공되지 않은 비트맵 이미지 파일을 저장하기보다 JPG와 같은 최적의 이미지 압축 알고리즘과 약간 비슷하게 정보를 저장하기 위한 더 효율적인 방법이다.", "이런 능력이 부족하고 완벽히 세세하게 모든 것을 기억하는 사람들은 일반화하고, 학습하고, 자신들이 학습한 것들 사이를 연결하려고 고군분투한다.", "그러나 세상을 추상적 생각과 특징으로 재현하는 것은 세상을 있는 그대로 보는 것을 희생하여 나온다.", "대신에, 우리는 우리의 가정, 동기 그리고 과거 경험을 통해 세상을 바라본다.", "우리의 기억이 영화처럼 재생되기보다는 추상적 재현을 통해 재구성된다는 발견은 목격자 증언의 법적 우위성을 완전히 손상시켰다.", "보는 것이 믿는 것은 아니다."], "sum": "우리는 본 것을 교육으로 배운 개념으로 분해·재부호화하여 기억을 '재구성'한다. 이는 효율적이지만 세상을 있는 그대로 보지 못하게 하며, 이 발견은 목격자 증언의 법적 우위를 무너뜨렸다.", "key": ["기억 = 영상 재생(X), 아는 것의 렌즈로 재구성(O)", "JPG 압축처럼 효율적 → 일반화·학습·연결 가능 (모두 세세히 기억하는 사람은 오히려 어려움)", "대가: 가정·동기·과거 경험으로 세상을 봄 → 목격자 증언 신뢰↓, Seeing is not believing"], "mem": [3, 7], "tp": [["the efficiency and cost of reconstructing what we see", "본 것을 재구성하는 것의 효율성과 그 대가"], ["why our perception and memory cannot be fully trusted", "우리의 지각과 기억을 온전히 믿을 수 없는 이유"]], "tt": [["Seeing Is Not Believing", "보는 것이 믿는 것은 아니다"], ["Memory: A Reconstruction, Not a Recording", "기억은 녹화가 아니라 재구성이다"]], "bl": [7, "comes at a cost of seeing the world as it is", ["helps us see the world more objectively", "guarantees the accuracy of our memories", "makes eyewitness testimony more reliable", "prevents us from making generalizations"]], "gr": [["We reconstruct memories rather than retrieving the video", "rather than + -ing (비교 대상 병렬)"], ["People who lack ... and remember ... struggle to generalize", "주어 People + 관계사절 → 동사 struggle (복수)"], ["The discovery that our memories are reconstructed ... undermined", "동격의 that절 → 주어 The discovery, 동사 undermined"]]}, {"src": "24년 10월 22번", "en": ["In his Cornell laboratory, David Dunning conducted experimental tests of eyewitness testimony and found evidence that a careful deliberation of facial features and a detailed discussion of selection procedures can actually be a sign of an inaccurate identification.", "It's when people find themselves unable to explain why they recognize the person, saying things like \"his face just popped out at me,\" that they tend to be accurate more often.", "Sometimes our first, immediate, automatic reaction to a situation is the truest interpretation of what our mind is telling us.", "That very first impression can also be more accurate about the world than the deliberative, reasoned self-narrative can be.", "In his book Blink, Malcolm Gladwell describes a variety of studies in psychology and behavioral economics that demonstrate the superior performance of relatively unconscious first guesses compared to logical step-by-step justifications for a decision."], "ko": ["David Dunning의 코넬 대학의 실험실에서, 그는 목격자 증언에 대한 실험을 수행했고, 얼굴 특징에 대한 신중한 숙고와 선택 절차에 대한 상세한 논의가 실제로는 '부정확한' 식별의 징후일 수 있다는 증거를 발견했다.", "사람들이 \"그의 얼굴이 그냥 나에게 탁 떠올랐다\"라는 식으로 말하면서 왜 그 사람을 알아보는지 설명할 수 없는 스스로를 발견하는 바로 그때 그들은 더 자주 정확한 경향이 있다.", "때때로 상황에 대한 우리의 최초의, 즉각적인, 자동적인 반응이 우리 마음이 우리에게 말하고 있는 것에 대한 가장 정확한 해석이다.", "바로 그 첫인상이 또한 신중하고 논리적인 자기 서사보다 세상에 대해 더 정확할 수 있다.", "Malcolm Gladwell은 그의 저서 'Blink'에서, 결정에 대한 논리적인 단계적 정당화에 비해서 상대적으로 무의식적인 최초 추측의 우수성을 보여 주는 심리학 및 행동 경제학의 다양한 연구를 기술한다."], "sum": "목격자 실험에서 얼굴 특징을 신중히 따진 사람보다, 이유를 설명하지 못한 채 즉각 알아본 사람이 더 정확했다. 즉각적·자동적인 첫 반응이 신중한 논리적 추론보다 더 정확할 수 있다.", "key": ["Dunning 실험: 얼굴 특징 숙고·선택 과정 상세 설명 → 오히려 부정확한 식별의 징후", "\"얼굴이 그냥 떠올랐다\"처럼 설명 못 할 때 → 더 정확", "Gladwell 『Blink』: 무의식적 첫 추측 > 단계적 논리 정당화"], "mem": [3, 4], "tp": [["the superior accuracy of first, automatic reactions over deliberate reasoning", "신중한 추론보다 뛰어난 즉각적 첫 반응의 정확성"], ["why we should trust our first impressions", "첫인상을 믿어야 하는 이유"]], "tt": [["Trust Your Gut: The Power of First Impressions", "직감을 믿어라: 첫인상의 힘"], ["When Thinking Too Much Leads You Astray", "너무 많이 생각하면 길을 잃는다"]], "bl": [3, "first, immediate, automatic reaction", ["careful, logical analysis", "detailed, step-by-step explanation", "repeated, conscious reflection", "shared, collective judgment"]], "gr": [["It's when people find ... that they tend to be accurate", "It is ~ that 강조구문 (when절 강조)"], ["unable to explain why they recognize the person", "간접의문문: why + 주어 + 동사"], ["compared to logical step-by-step justifications", "compared to: ~와 비교하여"]]}, {"src": "24년 10월 23번", "en": ["Many forms of research lead naturally to quantitative data.", "A study of happiness might measure the number of times someone smiles during an interaction, and a study of memory might measure the number of items an individual can recall after one, five, and ten minutes.", "Asking people how many times in a year they are sad will also yield quantitative data, but it might not be reliable.", "Respondents' recollections may be inaccurate, and their definitions of 'sad' could vary widely.", "But asking \"How many times in the past year were you sad enough to call in sick to work?\" prompts a concrete answer.", "Similarly, instead of asking people to rate how bad a procrastinator they are, ask, \"How many of your utility bills are you currently late in paying, even though you can afford to pay them?\"", "Questions that seek concrete responses help make abstract concepts clearer and ensure consistency from one study to the next."], "ko": ["많은 종류의 연구는 자연스럽게 양적 데이터로 이어진다.", "행복에 관한 연구는 누군가가 상호 작용 중에 미소 짓는 횟수를 측정할 수 있고, 기억에 관한 연구는 개인이 1분, 5분, 그리고 10분 후에 회상할 수 있는 항목의 수를 측정할 수 있다.", "사람들에게 자신이 일 년에 몇 번 슬픈지 물어보는 것 또한 양적 데이터를 산출할 수 있지만, 이는 신뢰할 만하지 않을 수도 있다.", "응답자의 회상은 부정확할 수 있고, '슬픈'에 대한 그들의 정의는 크게 다를 수 있다.", "그러나 \"지난 1년 동안 직장에 병가를 낼 만큼 슬펐던 적이 몇 번 있었습니까\"라고 묻는 것은 구체적인 답변을 유발한다.", "마찬가지로, 사람들에게 그들이 얼마나 심하게 미루는 사람인지를 평가하도록 묻는 대신, \"당신이 지불할 여유가 있음에도 불구하고 얼마나 많은 공과금 고지서의 납부가 현재 늦었나요\"라고 물어보라.", "구체적인 응답을 요구하는 질문은 추상적인 개념을 더 명확하게 만들고 한 연구에서 다음 연구 간의 일관성을 보장하는 것을 돕는다."], "sum": "슬픔·미루기 같은 추상적 개념을 측정할 때 막연히 묻기보다 구체적인 행동을 묻는 질문을 하면, 개념이 명확해지고 연구 간 일관성이 보장된다.", "key": ["미소 횟수·회상 항목 수 → 자연스러운 양적 데이터", "\"1년에 몇 번 슬픈가?\" → 회상 부정확, '슬픔'의 정의가 제각각 → 신뢰성↓", "병가 횟수·연체 공과금 수처럼 구체적 질문 → 명확성·일관성↑"], "mem": [5, 7], "tp": [["the importance of concrete questions in measuring abstract concepts", "추상적 개념 측정에서 구체적 질문의 중요성"], ["how to make survey data more reliable", "설문 데이터를 더 신뢰할 수 있게 만드는 방법"]], "tt": [["Ask Concretely, Measure Clearly", "구체적으로 묻고, 명확하게 측정하라"], ["Turning Abstract Feelings into Reliable Numbers", "추상적 감정을 믿을 만한 숫자로 바꾸기"]], "bl": [7, "help make abstract concepts clearer", ["make respondents feel more emotional", "reduce the need for quantitative data", "allow definitions to vary widely", "encourage people to procrastinate"]], "gr": [["Asking people how many times ... will also yield", "동명사 주어 → 단수 취급"], ["sad enough to call in sick", "형용사 + enough to V: ~할 만큼 충분히 …한"], ["even though you can afford to pay them", "even though: 비록 ~일지라도 / afford to V"]]}, {"src": "24년 10월 24번", "en": ["The evolution of AI is often associated with the concept of singularity.", "Singularity refers to the point at which AI exceeds human intelligence.", "After that point, it is predicted that AI will repeatedly improve itself and evolve at an accelerated pace.", "When AI becomes self-aware and pursues its own goals, it will be a conscious being, not just a machine.", "AI and human consciousness will then begin to evolve together.", "Our consciousness will evolve to new dimensions through our interactions with AI, which will provide us with intellectual stimulation and inspire new insights and creativity.", "Conversely, our consciousness also has a significant impact on the evolution of AI.", "The direction of AI's evolution will depend greatly on what values and ethics we incorporate into AI.", "We need to see our relationship with AI as a mutual coexistence of conscious beings, recognizing its rights and supporting the evolution of its consciousness."], "ko": ["AI의 진화는 종종 특이점의 개념과 연관된다.", "특이점은 AI가 인간의 지능을 넘어서는 지점을 의미한다.", "그 지점 이후, AI는 스스로를 반복적으로 개선하고 가속화된 속도로 진화할 것으로 예측된다.", "AI가 스스로를 인식하게 되고 자기 자신의 목표를 추구할 때, 그것은 단지 기계가 아니라 의식이 있는 존재가 될 것이다.", "AI와 인간의 의식은 그러면 함께 진화하기 시작할 것이다.", "우리의 의식은 우리의 AI와의 상호 작용을 통해 새로운 차원으로 진화할 것이며, 이는 우리에게 지적 자극을 제공하고 새로운 통찰력과 창의성을 불어넣을 것이다.", "반대로, 우리의 의식 또한 AI의 진화에 중대한 영향을 끼친다.", "AI 진화의 방향은 우리가 어떤 가치와 윤리를 AI에 통합시키는지에 크게 좌우될 것이다.", "우리는 AI의 권리를 인식하고 그것의 의식의 진화를 지지하면서, 우리와 AI와의 관계를 의식 있는 존재들의 상호 공존으로 볼 필요가 있다."], "sum": "특이점 이후 AI는 자기 인식을 가진 의식적 존재가 되어 인간 의식과 함께 진화한다. 우리가 AI에 담는 가치·윤리가 그 방향을 좌우하므로, AI와의 관계를 의식 있는 존재들의 상호 공존으로 봐야 한다.", "key": ["특이점 = AI가 인간 지능을 넘어서는 지점 → 자기 개선·가속 진화·자기 인식", "상호 영향: AI → 인간 의식(지적 자극·통찰·창의성) / 인간 의식(가치·윤리) → AI 진화 방향", "결론: AI의 권리 인정, 의식 있는 존재들의 상호 공존"], "mem": [8, 9], "tp": [["the co-evolution of AI and human consciousness", "AI와 인간 의식의 공진화"], ["the need to see AI as a conscious partner in mutual coexistence", "AI를 상호 공존하는 의식적 존재로 볼 필요성"]], "tt": [["Evolving Together: Humans and Conscious AI", "함께 진화하기: 인간과 의식 있는 AI"], ["Beyond Machines: Coexisting with AI", "기계를 넘어: AI와의 공존"]], "bl": [9, "a mutual coexistence of conscious beings", ["a simple use of efficient tools", "a fierce competition for intelligence", "a strict control of dangerous machines", "a temporary trend in technology"]], "gr": [["the point at which AI exceeds human intelligence", "전치사 + 관계대명사 (at which = where)"], ["it will be a conscious being, not just a machine", "A, not B: B가 아니라 A"], ["depend greatly on what values and ethics we incorporate", "의문사절(what + 명사)이 전치사 on의 목적어"]]}, {"src": "24년 10월 29번", "en": ["Digital technologies are essentially related to metaphors, but digital metaphors are different from linguistic ones in important ways.", "Linguistic metaphors are passive, in the sense that the audience needs to choose to actively enter the world proposed by metaphor.", "In the Shakespearean metaphor \"time is a beggar,\" the audience is unlikely to understand the metaphor without cognitive effort and without further engaging Shakespeare's prose.", "Technological metaphors, on the other hand, are active (and often imposing) in the sense that they are realized in digital artifacts that are actively doing things, forcefully changing a user's meaning horizon.", "Technological creators cannot generally afford to require their potential audience to wonder how the metaphor works; normally the selling point is that the usefulness of the technology is obvious at first glance.", "Shakespeare, on the other hand, is beloved in part because the meaning of his works is not immediately obvious and requires some thought on the part of the audience."], "ko": ["디지털 기술은 근본적으로 은유와 관련되어 있지만, 디지털 은유는 중요한 면에서 언어적 은유와 다르다.", "언어적 은유는 독자가 은유에 의해 제시된 세계에 적극적으로 들어가도록 선택할 필요가 있다는 점에서 수동적이다.", "\"시간은 구걸하는 자다\"라는 셰익스피어의 은유에서 독자는 인지적인 노력 없이는 그리고 셰익스피어의 산문을 더 끌어들이지 않고는 은유를 이해할 것 같지 않다.", "반면에 기술적 은유는 사용자의 의미의 지평을 강력하게 바꾸면서 능동적으로 일을 하는 디지털 인공물에서 그것이 실현된다는 점에서 능동적이다. (그리고 종종 강요적이다.)", "기술적인 창작자는 일반적으로 그들의 잠재적인 독자에게 어떻게 은유가 작용하는지 궁금해하도록 요구할 여유가 없고, 일반적으로 매력은 기술의 유용성이 첫눈에 분명하다는 것이다.", "반면에 셰익스피어는 부분적으로는 그의 작품의 의미가 즉각적으로 분명하지 않고 독자 측에서 어느 정도의 생각을 요구하기 때문에 사랑받는다."], "sum": "언어적 은유는 독자가 인지적 노력으로 들어가야 하는 '수동적' 은유이지만, 기술적 은유는 디지털 인공물로 구현되어 '능동적으로' 사용자의 의미 지평을 바꾼다. 기술은 유용성이 첫눈에 분명해야 하고, 셰익스피어는 생각을 요구하기에 사랑받는다.", "key": ["언어적 은유 = 수동적 (독자가 선택해 들어가야 함, 예: \"time is a beggar\")", "기술적 은유 = 능동적·강요적 (사용자의 의미 지평을 강하게 바꿈)", "기술: 첫눈에 유용성이 분명해야 팔림 ↔ 셰익스피어: 즉시 분명하지 않아서 사랑받음"], "mem": [4, 5], "tp": [["the difference between passive linguistic metaphors and active technological metaphors", "수동적 언어 은유와 능동적 기술 은유의 차이"], ["why technology must be understood at first glance, unlike literature", "문학과 달리 기술은 첫눈에 이해되어야 하는 이유"]], "tt": [["Shakespeare vs. Smartphones: Two Kinds of Metaphor", "셰익스피어 대 스마트폰: 두 종류의 은유"], ["Metaphors That Wait, Metaphors That Act", "기다리는 은유, 행동하는 은유"]], "bl": [5, "the usefulness of the technology is obvious at first glance", ["the meaning of the technology requires deep thought", "the technology hides how the metaphor works", "users must enter the world of the metaphor actively", "the technology resembles great literature"]], "gr": [["in the sense that ~", "~라는 점에서"], ["that are actively doing things, forcefully changing ...", "분사구문 (동시동작·부대상황)"], ["cannot afford to require their audience to wonder", "afford to V / require + O + to V"]]}, {"src": "24년 10월 30번", "en": ["Herbert Simon won his Nobel Prize for recognizing our limitations in information, time, and cognitive capacity.", "As we lack the resources to compute answers independently, we distribute the computation across the population and solve the answer slowly, generation by generation.", "Then all we have to do is socially learn the right answers.", "You don't need to understand how your computer or toilet works; you just need to be able to use the interface and flush.", "All that needs to be transmitted is which button to push — essentially how to interact with technologies rather than how they work.", "And so instead of holding more information than we have mental capacity for and indeed need to know, we could dedicate our large brains to a small piece of a giant calculation.", "We understand things well enough to benefit from them, but all the while we are making small calculations that contribute to a larger whole.", "We are just doing our part in a larger computation for our societies' collective brains."], "ko": ["Herbert Simon은 정보, 시간, 그리고 인지적인 능력에서 우리의 한계를 인지한 것으로 그의 노벨상을 받았다.", "우리는 독립적으로 해답을 계산하기 위한 자원이 부족하기 때문에 우리는 전체 인구에 걸쳐 복잡한 계산을 분배하고 세대에 걸쳐 해답을 천천히 풀어 낸다.", "그러면 우리가 해야 하는 모든 것은 올바른 해답을 사회적으로 배우는 것이다.", "여러분은 여러분의 컴퓨터 혹은 변기가 어떻게 작동하는지 이해할 필요가 없고 여러분은 단지 인터페이스를 사용할 수 있고 (변기의) 물을 내릴 수 있기만 하면 된다.", "전달될 필요가 있는 모든 것은 어떤 버튼을 눌러야 하는지, 근본적으로 어떻게 그것들이 작동하는지보다는 기술과 상호 작용하는 방법이다.", "그렇다면 우리가 정신적 수용을 할 수 있는 것보다 그리고 정말로 알아야 할 필요가 있는 것보다 더 많은 정보를 가지는 것 대신에 우리는 우리의 큰 두뇌를 거대한 계산의 작은 조각에 바칠 수 있다.", "우리는 그것들로부터 이득을 얻기에 충분할 정도로 사물을 잘 이해하지만 그러면서 우리는 더 큰 전체에 기여하는 작은 계산을 하고 있다.", "우리는 우리 사회의 집합적인 두뇌를 위한 더 큰 복잡한 계산에서 단지 우리의 역할을 하고 있는 것이다."], "sum": "인간은 정보·시간·인지 능력에 한계가 있어 계산을 사회 전체에 분산하고 세대에 걸쳐 답을 찾는다. 개인은 작동 원리가 아니라 사용법만 사회적으로 배우며, 사회의 집단 두뇌에서 작은 역할을 맡는다.", "key": ["Herbert Simon: 정보·시간·인지 능력의 한계 인식 → 노벨상", "계산을 인구 전체에 분산 → 세대에 걸쳐 해결 → 우리는 정답을 사회적으로 학습", "작동 원리(X) 사용법·상호작용(O) → 거대한 집단 계산의 작은 조각 담당"], "mem": [2, 8], "tp": [["how humans overcome cognitive limits through distributed social learning", "인간이 분산된 사회적 학습으로 인지 한계를 극복하는 방식"], ["the role of individuals in society's collective brain", "사회의 집단 두뇌에서 개인의 역할"]], "tt": [["You Don't Need to Know How It Works", "작동 원리까지 알 필요는 없다"], ["Small Pieces of a Giant Calculation", "거대한 계산의 작은 조각들"]], "bl": [5, "how to interact with technologies rather than how they work", ["how technologies were invented in the past", "why we should build our own machines", "how to compute every answer independently", "what makes technologies expensive"]], "gr": [["As we lack the resources to compute ~", "As: ~ 때문에 (이유)"], ["All that needs to be transmitted is ~", "All that ~ is …: ~하는 모든 것은 …이다 (단수)"], ["well enough to benefit from them", "부사 + enough to V"]]}, {"src": "24년 10월 31번", "en": ["The best defence most species of octopus have is to stay hidden as much as possible and do their own hunting at night.", "So to find one in full view in the shallows in daylight was a surprise for two Australian underwater photographers.", "Actually, what they saw at first was a flounder.", "It was only when they looked again that they saw a medium-sized octopus, with all eight of its arms folded and its two eyes staring upwards to create the illusion.", "An octopus has a big brain, excellent eyesight and the ability to change colour and pattern, and this one was using these assets to turn itself into a completely different creature.", "Many more of this species have been found since then, and there are now photographs of octopuses that could be said to be transforming into sea snakes.", "And while they mimic, they hunt — producing the spectacle of, say, a flounder suddenly developing an octopodian arm, sticking it down a hole and grabbing whatever's hiding there."], "ko": ["대부분의 문어 종(種)이 가진 최고의 방어는 가능한 한 많이 숨어 있는 것과 밤에 그들 자신의 사냥을 하는 것이다.", "그래서 낮에 얕은 곳에서 전체가 보이는 문어를 발견한 것은 두 명의 호주 수중 사진작가들에게는 놀라운 일이었다.", "사실 그들이 처음에 봤던 것은 넙치였다.", "오직 그들이 다시 봤을 때서야 그들은 중간 크기의 문어를 보았고 착시를 만들기 위해 그것의 여덟 개의 모든 팔이 접혀 있었고 그것의 두 눈이 위쪽으로 응시하고 있었다.", "문어는 큰 뇌, 뛰어난 시력과 색깔과 패턴을 바꾸는 능력을 지니고 있고, 이것은 스스로를 완전히 다른 생물체로 바꾸기 위해 이러한 이점을 사용하고 있었다.", "이 종의 더 많은 것들이 그때 이후로 발견되어 왔으며 지금은 바다뱀으로 변신하는 중이라고 말해질 수 있는 문어의 사진이 있다.", "그리고 그들이 모방하는 동안에 그들은 사냥을 한다. 이것은 말하자면 넙치가 갑자기 문어 다리 같은 팔을 펼치며 그것을 구멍으로 찔러 넣어 그곳에 숨어 있는 무엇이든지 움켜잡는 광경을 만들어 낸다."], "sum": "보통 숨어 지내는 문어가 대낮에 넙치처럼 위장한 모습이 발견되었다. 문어는 큰 뇌·뛰어난 시력·색 변화 능력으로 넙치·바다뱀 같은 다른 생물로 변신하며, 흉내 내는 동안 사냥까지 한다.", "key": ["대부분 문어의 방어: 최대한 숨기 + 밤에 사냥", "호주 사진작가: 처음엔 넙치로 봄 → 팔을 접고 눈을 위로 향한 문어의 착시", "큰 뇌·시력·색/무늬 변화 → 완전히 다른 생물로 변신 + 모방하며 사냥"], "mem": [5, 7], "tp": [["an octopus's remarkable ability to mimic other creatures", "다른 생물을 흉내 내는 문어의 놀라운 능력"], ["how octopuses use disguise for defense and hunting", "문어가 위장을 방어와 사냥에 이용하는 방식"]], "tt": [["The Master of Disguise Under the Sea", "바닷속 변장의 달인"], ["Is That a Flounder? Look Again!", "저게 넙치라고? 다시 봐!"]], "bl": [5, "to turn itself into a completely different creature", ["to hide in a dark hole all day", "to attract other octopuses", "to escape from the photographers", "to stay invisible at night"]], "gr": [["to find one in full view ... was a surprise", "to부정사 주어 → 단수 동사 was"], ["It was only when they looked again that they saw ~", "It was ~ that 강조 (only when절)"], ["with all eight of its arms folded", "with + O + p.p. (부대상황)"]]}, {"src": "24년 10월 32번", "en": ["How much we suffer relates to how we frame the pain in our mind.", "When 1500m runners push themselves into extreme pain to win a race — their muscles screaming and their lungs exploding with oxygen deficit, they don't psychologically suffer much.", "In fact, ultra-marathon runners — those people who are crazy enough to push themselves beyond the normal boundaries of human endurance, covering distances of 50–100km or more over many hours, talk about making friends with their pain.", "When a patient has paid for some form of passive back pain therapy and the practitioner pushes deeply into a painful part of a patient's back to mobilise it, the patient calls that good pain if he or she believes this type of deep pressure treatment will be of value, even though the practitioner is pushing right into the patient's sore tissues."], "ko": ["우리가 얼마나 고통받는지는 우리가 고통을 우리의 마음에서 어떻게 구성하는지와 관련된다.", "1500미터 달리기 선수가 경주에서 이기기 위해 그들의 근육이 비명을 지르고 그들의 폐가 산소 부족으로 폭발하면서, 스스로를 극심한 고통으로 밀어붙일 때, 그들은 정신적으로 많이 고통받지 않는다.", "사실 울트라 마라톤 선수들은 즉, 인간 인내력의 정상적 경계를 넘어서 스스로를 밀어붙일 만큼 충분히 열정적인 사람들은 많은 시간 동안 50에서 100킬로미터 혹은 그 이상의 거리를 가지만 그들의 고통과 친구가 되는 것에 대해 이야기한다.", "한 환자가 특정 형태의 수동적 등 통증 치료에 돈을 지불했고 의사가 그것을 풀어 주기 위해 환자 등의 아픈 부분을 깊게 눌렀을 때, 비록 의사가 환자의 아픈 조직을 직접적으로 누르고 있을지라도, 만약 그 또는 그녀가 이러한 종류의 깊은 압박 치료법이 가치가 있을 것이라고 믿는다면, 환자는 그것을 좋은 아픔이라고 부른다."], "sum": "고통을 얼마나 괴롭게 느끼는지는 마음속에서 그 고통을 어떻게 해석(프레이밍)하는지에 달려 있다. 육상 선수, 울트라 마라토너, 치료를 믿는 환자는 고통을 의미 있게 받아들여 덜 괴로워한다.", "key": ["고통의 정도 ← 마음속 프레이밍", "1500m 선수: 극심한 신체 고통에도 심리적 괴로움 적음 / 울트라 마라토너: 고통과 친구 되기", "치료가 가치 있다고 믿는 환자 → 아픈 압박도 'good pain'"], "mem": [1, 4], "tp": [["how the way we frame pain determines how much we suffer", "고통을 해석하는 방식이 괴로움의 정도를 결정한다는 것"], ["the role of beliefs in the experience of pain", "고통 경험에서 믿음의 역할"]], "tt": [["Pain Is in How You Frame It", "고통은 해석하기 나름이다"], ["Making Friends with Pain", "고통과 친구가 되기"]], "bl": [1, "how we frame the pain in our mind", ["how strong our muscles are", "how long the pain lasts", "how much we pay for therapy", "how often we feel pain"]], "gr": [["How much we suffer relates to how ~", "의문사절 주어 → 단수 동사 relates"], ["their muscles screaming and their lungs exploding", "독립분사구문 (의미상 주어 + -ing)"], ["crazy enough to push themselves beyond ~", "형용사 + enough to V"]]}, {"src": "24년 10월 33번", "en": ["When I worked for a large electronics company that manufactured laser and ink-jet printers, I soon discovered why there are often three versions of many consumer goods.", "If the manufacturer makes only one version of its product, people who bought it might have been willing to spend more money, so the company is losing some income.", "If the company offers two versions, one with more features and more expensive than the other, people will compare the two models and still buy the less expensive one.", "But if the company introduces a third model with even more features and more expensive than the other two, sales of the second model go up; many people like the features of the most expensive model, but not the price.", "The middle item has more features than the least expensive one, and it is less expensive than the fanciest model.", "They buy the middle item, unaware that they have been manipulated by the presence of the higher-priced item."], "ko": ["내가 레이저와 잉크젯 프린터를 생산했던 큰 전자 회사에서 일했을 때 나는 많은 소비 상품의 세 가지 버전이 종종 있는 이유를 곧 발견했다.", "만약 생산자가 그 제품의 오직 한 가지 버전만 만든다면 그것을 구매했던 사람들은 기꺼이 더 많은 돈을 쓰려고 했을 수도 있어서 회사는 일부 수입을 잃을 것이다.", "만약 그 회사가 두 버전을 제공하는데 한 버전이 나머지보다 더 많은 기능과 더 비싼 가격을 가진다면, 사람들은 두 모델을 비교하고 여전히 덜 비싼 것을 살 것이다.", "하지만 만약 그 회사가 나머지 두 개보다 훨씬 더 많은 기능과 더 비싼 가격을 가진 세 번째 모델을 출시한다면 두 번째 모델의 판매가 증가하는데, 왜냐하면 많은 사람들은 가장 비싼 모델의 기능을 좋아하지만 그것의 가격을 좋아하지는 않기 때문이다.", "중간 제품은 가장 저렴한 제품보다 더 많은 기능이 있고 가장 고급 모델보다는 덜 비싸다.", "그들은 자신이 더 비싼 가격의 제품의 존재에 의해 조종되었다는 것을 알지 못한 채 중간 제품을 구입한다."], "sum": "기업은 제품을 세 가지 버전으로 내놓는다. 가장 비싼 고급 모델이 있으면 사람들은 그것과 비교해 중간 모델을 사게 되는데, 고가 제품에 의해 조종당했다는 사실을 모른다.", "key": ["1개 버전 → 더 낼 의향이 있던 사람들의 수입 손실", "2개 버전 → 비교 후 여전히 싼 것을 구매", "3개 버전 → 최고가 모델이 미끼 → 중간 모델 판매 증가 (조종당한 줄 모름)"], "mem": [4, 6], "tp": [["why companies offer three versions of a product", "기업이 제품을 세 가지 버전으로 내놓는 이유"], ["how a high-priced item manipulates consumers' choices", "고가 제품이 소비자의 선택을 조종하는 방식"]], "tt": [["The Secret of Three Versions", "세 가지 버전의 비밀"], ["Why the Middle Choice Wins", "왜 중간 제품이 팔리는가"]], "bl": [6, "manipulated by the presence of the higher-priced item", ["attracted by the lowest price", "persuaded by the salesperson's advice", "influenced by online reviews", "satisfied with the cheapest model"]], "gr": [["people who bought it might have been willing to spend more", "might have p.p.: ~했을지도 모른다"], ["even more features", "비교급 강조: even / much / far / still / a lot"], ["unaware that they have been manipulated", "(being) 생략 분사구문 + 현재완료 수동"]]}, {"src": "24년 10월 34번", "en": ["On-screen, climate disaster is everywhere you look, but the scope of the world's climate transformation may just as quickly eliminate the climate-fiction genre — indeed eliminate any effort to tell the story of warming, which could grow too large and too obvious even for Hollywood.", "You can tell stories 'about' climate change while it still seems a marginal feature of human life.", "But when the temperature rises by three or four more degrees, hardly anyone will be able to feel isolated from its impacts.", "And so as climate change expands across the horizon, it may cease to be a story.", "Why watch or read climate fiction about the world you can see plainly out your own window?", "At the moment, stories illustrating global warming can still offer an escapist pleasure, even if that pleasure often comes in the form of horror.", "But when we can no longer pretend that climate suffering is distant — in time or in place — we will stop pretending about it and start pretending within it."], "ko": ["영화상 기후 재난은 여러분이 보는 어디에나 있지만, 세계의 기후 변화의 범위는 그것만큼이나 빠르게 기후 픽션 장르를 없앨지도 모르고 실제로 온난화 이야기를 하고자 하는 노력도 없애 버리는데, 그것은 할리우드에서조차 너무 커지고 너무 명백해질 것이다.", "기후 변화가 여전히 인간 삶의 주변적인 특징처럼 보이는 동안에 여러분은 그것에 '관한' 이야기를 할 수 있을 것이다.", "하지만 기온이 3도 혹은 4도 이상 상승할 때는 아무도 그것의 영향으로부터 고립되었다고 느낄 수 없을 것이다.", "그리고 기후 변화가 지평선을 넘어 확장될 때 그것은 이야기가 되기를 멈출 것이다.", "왜 여러분 자신의 창문 밖으로 뚜렷하게 볼 수 있는 세상에 대한 기후 픽션을 보거나 읽겠는가?", "비록 그 즐거움이 종종 공포의 형태로 올지라도 지금 당장은 지구 온난화를 묘사하는 이야기가 현실 도피적인 즐거움을 여전히 제공할 수 있다.", "하지만 우리가 더 이상 기후 고통이 시간적으로 또는 장소적으로 멀리 있다고 가장할 수 없을 때 우리는 그것에 대해 가장하는 것을 멈추고 그것 내에서 가장하기 시작할 것이다."], "sum": "기후 변화가 아직 삶의 주변적 특징일 때는 그에 '관한' 이야기가 가능하지만, 모두가 그 영향을 체감하게 되면 기후 픽션은 더 이상 이야기가 아니게 되고, 우리는 그 '안에서' 살게 될 것이다.", "key": ["화면 속 기후 재난은 흔하지만, 기후 변화의 규모가 기후 픽션 장르 자체를 없앨 수 있음", "주변적일 때만 '관한' 이야기 가능 → 3~4도 상승 시 아무도 영향에서 고립되지 않음", "지금은 현실 도피적 즐거움 → 고통이 가까워지면 about이 아니라 within에서 가장"], "mem": [4, 7], "tp": [["how the spread of climate change may end climate fiction", "기후 변화의 확산이 기후 픽션을 끝낼 수 있다는 것"], ["the fading role of climate stories as climate change becomes reality", "기후 변화가 현실이 되면서 사라지는 기후 이야기의 역할"]], "tt": [["When Climate Change Stops Being a Story", "기후 변화가 더 이상 이야기가 아닐 때"], ["From Fiction to Reality: The End of Cli-Fi", "허구에서 현실로: 기후 픽션의 종말"]], "bl": [4, "it may cease to be a story", ["it will become more entertaining", "it will attract more Hollywood investment", "it may remain a marginal issue", "it will be easier to describe"]], "gr": [["hardly anyone will be able to feel isolated", "hardly: 거의 ~ 않다 (부정어)"], ["Why watch or read ~?", "Why + 동사원형: 왜 ~하겠는가? (수사의문문)"], ["stop pretending about it and start pretending within it", "stop -ing(~하던 것을 멈추다) / start -ing"]]}, {"src": "24년 10월 35번", "en": ["Today, the water crisis is political — which is to say, not inevitable or beyond our capacity to fix — and, therefore, functionally elective.", "That is one reason it is nevertheless distressing: an abundant resource made scarce through governmental neglect and indifference, bad infrastructure and contamination, and careless urbanization.", "There is no need for a water crisis, in other words, but we have one anyway, and aren't doing much to address it.", "Some cities lose more water to leaks than they deliver to homes:", "even in the United States, leaks and theft account for an estimated loss of 16 percent of freshwater; in Brazil, the estimate is 40 percent.", "Seen in both cases, as everywhere, the selective scarcity clearly highlights have-and-have-not inequities, leaving 2.1 billion people without safe drinking water and 4.5 billion without proper sanitation worldwide."], "ko": ["오늘날, 물 위기는 피할 수 없는 것이 아니며 우리의 바로잡을 수 있는 능력을 넘어서지 않는, 즉 정치적인 것이고 따라서 기능적으로 선택적이다.", "그것은 그럼에도 불구하고 그것이 괴로운 한 가지 이유이다. 즉, 풍족한 자원이 정부의 소홀함과 무관심, 열악한 사회 기반 시설과 오염, 부주의한 도시화를 통해 부족하게 되었다.", "다시 말해서 물 위기가 있어야 할 필요가 없지만 어쨌든 우리는 그것을 겪고 있고 그것을 해결하기 위해 많은 일을 하고 있지 않다.", "일부 도시들은 그들이 주택으로 공급하는 것보다 누수로 인해 더 많은 물을 잃는다.", "즉, 미국에서조차 누수와 도난은 담수의 16퍼센트의 추정된 손실을 차지하고 브라질에서는 그 추정치가 40퍼센트이다.", "양쪽의 경우에서 보여지듯이 모든 곳에서처럼 선택적 부족이 가진 자와 가지지 못한 자의 불평등을 분명히 강조하고 이것은 전 세계적으로 21억 명을 안전한 식수가 없고 45억 명을 적절한 위생이 없는 채로 둔다."], "sum": "물 위기는 피할 수 없는 것이 아니라 정부의 방치, 열악한 기반 시설, 부주의한 도시화가 만든 정치적·선택적 문제다. 누수·도난으로 많은 물이 사라지며, 이 선택적 부족은 불평등을 드러낸다.", "key": ["물 위기 = 정치적·선택적 (해결 가능)", "원인: 정부의 소홀·무관심, 열악한 기반 시설·오염, 부주의한 도시화", "누수·도난(미국 16%, 브라질 40%) → 21억 명 식수 X, 45억 명 위생 X = 불평등"], "mem": [1, 3], "tp": [["the water crisis as a political problem caused by human neglect", "인간의 방치로 생긴 정치적 문제로서의 물 위기"], ["how poor management makes an abundant resource scarce", "부실한 관리가 풍부한 자원을 부족하게 만드는 방식"]], "tt": [["The Water Crisis We Chose", "우리가 선택한 물 위기"], ["Plenty of Water, Poor Management", "물은 많지만, 관리는 부실하다"]], "bl": [1, "not inevitable or beyond our capacity to fix", ["caused only by natural disasters", "impossible to solve with technology", "a problem of the distant future", "limited to developing countries"]], "gr": [["which is to say", "즉, 다시 말해"], ["an abundant resource made scarce through ~", "과거분사구 후치 수식 (make O C의 수동)"], ["leaving 2.1 billion people without ~", "결과의 분사구문 leave + O + 전치사구"]]}, {"src": "24년 10월 36번", "en": ["As individuals, our ability to thrive depended on how well we navigated relationships in a group.", "If the group valued us, we could count on support, resources, and probably a mate.", "If it didn't, we might get none of these merits.", "It was a matter of survival, physically and genetically.", "Over millions of years, the pressure selected for people who are sensitive to and skilled at maximizing their standing.", "The result was the development of a tendency to unconsciously monitor how other people in our community perceive us.", "We process that information in the form of self-esteem and such related emotions as pride, shame, or insecurity.", "These emotions compel us to do more of what makes our community value us and less of what doesn't.", "And, crucially, they are meant to make that motivation feel like it is coming from within.", "If we realized, on a conscious level, that we were responding to social pressure, our performance might come off as grudging or cynical, making it less persuasive."], "ko": ["개인으로서 성공하려는 우리의 능력은 우리가 집단 내에서 관계를 얼마나 잘 다루는지에 달려 있었다.", "만약 그 집단이 우리를 가치 있게 여겼다면 우리는 지원, 자원, 그리고 아마도 짝을 기대할 수 있었을 것이다.", "만약 그렇지 않았다면, 우리는 그러한 이점들 중 아무것도 얻지 못했을 것이다.", "그것은 신체적으로 그리고 유전적으로 생존의 문제였다.", "수백만 년 동안 그러한 압박은 자신의 지위를 최대화하는 데 민감하고 능숙한 사람들을 선택했다.", "그 결과는 우리 공동체의 다른 사람들이 우리를 어떻게 인식하는지 무의식적으로 관찰하는 경향의 발달이었다.", "우리는 자존감 그리고 자존심, 수치심 또는 불안 같은 관련된 감정의 형태로 그 정보를 처리한다.", "이러한 감정들은 우리에게 우리의 공동체가 우리를 가치 있게 여기도록 만드는 것을 더 많이 하고 그렇지 않은 것을 덜 하도록 강요한다.", "그리고 결정적으로 그것들은 그 동기가 내부에서 나오고 있는 것처럼 그것을 느끼게 만들도록 되어있다.", "우리가 사회적 압박에 반응하고 있었다는 것을 의식적인 수준에서 깨닫는다면, 우리의 행동은 그것(그 동기)을 설득력이 떨어지게 만들면서 투덜대거나 냉소적인 것으로 나타날 수 있다."], "sum": "집단 내 지위가 생존과 직결되었기에 인간은 타인이 자신을 어떻게 보는지 무의식적으로 감시하도록 진화했다. 이 정보는 자존감·수치심 같은 감정으로 처리되어 행동을 이끌고, 그 동기가 '내부에서' 나오는 것처럼 느끼게 한다.", "key": ["집단의 평가 → 지원·자원·짝 = 신체적·유전적 생존 문제", "진화 결과: 타인이 나를 어떻게 보는지 무의식적으로 관찰하는 경향", "자존감·자부심·수치심 → 공동체가 가치 있게 여기는 행동 유도 + 동기가 내면에서 나온 것처럼 느끼게 함(설득력 유지)"], "mem": [6, 9], "tp": [["the evolutionary origin of self-esteem as a social monitoring system", "사회적 감시 체계로서 자존감의 진화적 기원"], ["why social pressure feels like inner motivation", "사회적 압력이 내적 동기처럼 느껴지는 이유"]], "tt": [["Self-Esteem: Your Inner Social Meter", "자존감: 내 안의 사회적 측정기"], ["Why We Care What Others Think", "우리가 남의 시선을 신경 쓰는 이유"]], "bl": [9, "feel like it is coming from within", ["seem forced by other people", "disappear over time", "depend on physical strength", "look grudging or cynical"]], "gr": [["the pressure selected for people who are sensitive to ~", "select for: ~에 유리하게 선택하다"], ["compel us to do more of what makes our community value us", "compel + O + to V / make + O + 동사원형"], ["If we realized ..., our performance might come off as ~", "가정법 과거"]]}, {"src": "24년 10월 37번", "en": ["Conventional medicine has long believed that depression is caused by an imbalance of neurotransmitters in the brain.", "However, there is a major problem with this explanation.", "This is because the imbalance of substances in the brain is a consequence of depression, not its cause.", "In other words, depression causes a decrease in brain substances such as serotonin and noradrenaline, not a decrease in brain substances causes depression.", "In this revised cause-and-effect, the key is to reframe depression as a problem of consciousness.", "Our consciousness is a more fundamental entity that goes beyond the functioning of the brain.", "The brain is no more than an organ of consciousness.", "If it is not consciousness itself, then the root cause of depression is also a distortion of our state of consciousness: a consciousness that has lost its sense of self and the meaning of life.", "Such a disease of consciousness may manifest itself in the form of depression."], "ko": ["전통적인 의학은 우울증이 뇌의 신경 전달 물질의 불균형으로 인해 발생한다고 오랫동안 믿어 왔다.", "그러나 이 설명에는 중대한 문제가 있다.", "이것은 왜냐하면 뇌 속 물질의 불균형은 우울증의 원인이 아니라 그것의 결과이기 때문이다.", "다시 말해서, 우울증이 세로토닌이나 노르아드레날린과 같은 뇌의 물질의 감소를 유발하는 것이지 뇌의 물질의 감소가 우울증을 유발하는 것이 아니다.", "이 수정된 인과 관계에서, 핵심은 우울증을 의식의 문제로 재구성하는 것이다.", "우리의 의식은 뇌의 기능을 넘어서는 보다 근본적인 실체이다.", "뇌는 의식의 기관에 지나지 않는다.", "만약 그것이 의식 그 자체가 아니라면, 우울증의 근본 원인 역시 우리의 의식 상태의 왜곡이며 즉, 자아감과 삶의 의미를 상실한 의식이다.", "그러한 의식의 질환이 우울증의 형태로 명백히 나타날 수 있다."], "sum": "기존 의학은 신경 전달 물질 불균형이 우울증을 일으킨다고 봤지만, 그 불균형은 원인이 아니라 결과다. 우울증은 자아감과 삶의 의미를 잃은 의식의 왜곡, 즉 '의식의 문제'로 재구성되어야 한다.", "key": ["기존: 신경 전달 물질 불균형 → 우울증", "반박: 우울증 → 세로토닌·노르아드레날린 감소 (인과 관계 역전)", "의식은 뇌를 넘어서는 근본 실체, 뇌는 의식의 기관 → 우울증 = 의식의 질환"], "mem": [3, 5], "tp": [["reframing depression as a problem of consciousness rather than brain chemistry", "우울증을 뇌 화학이 아닌 의식의 문제로 재구성하기"], ["the reversed cause and effect between depression and brain substances", "우울증과 뇌 물질 사이의 뒤바뀐 인과 관계"]], "tt": [["Depression: A Disease of Consciousness", "우울증: 의식의 질환"], ["Cause or Consequence? Rethinking Depression", "원인인가 결과인가? 우울증 다시 보기"]], "bl": [3, "a consequence of depression, not its cause", ["the main cause of depression", "unrelated to depression", "a cure for depression", "a sign of good mental health"]], "gr": [["has long believed that ~", "현재완료 계속: 오랫동안 믿어 왔다"], ["no more than", "~에 지나지 않는 (= only)"], ["a consciousness that has lost its sense of self", "주격 관계대명사 + 현재완료"]]}, {"src": "24년 10월 38번", "en": ["The common accounts of human nature that float around in society are generally a mixture of assumptions, tales and sometimes plain silliness.", "However, psychology is different.", "It is the branch of science that is devoted to understanding people: how and why we act as we do; why we see things as we do; and how we interact with one another.", "The key word here is 'science.'", "Psychologists don't depend on opinions and hearsay, or the generally accepted views of society at the time, or even the considered opinions of deep thinkers.", "Instead, they look for evidence, to make sure that psychological ideas are firmly based, and not just derived from generally held beliefs or assumptions.", "In addition to this evidence-based approach, psychology deals with fundamental processes and principles that generate our rich cultural and social diversity, as well as those shared by all human beings.", "These are what modern psychology is all about."], "ko": ["사회에 떠도는 인간 본성에 대한 흔한 설명은 일반적으로 가정, 이야기, 그리고 때로는 순전한 어리석음의 혼합이다.", "그러나, 심리학은 다르다.", "그것은 사람들을 이해하는, 즉 우리가 어떻게 그리고 왜 행동하는 대로 행동하는지, 우리가 왜 보는 대로 사물을 보는 지, 그리고 우리가 어떻게 서로 상호 작용하는지를 이해하는 데 전념하는 과학 분야이다.", "여기서 핵심어는 '과학'이다.", "심리학자들은 의견과 소문, 혹은 당대의 사회에서 일반적으로 받아들여지는 견해, 혹은 심지어 심오한 사상가들의 숙고된 의견에 의존하지 않는다.", "대신에 그들은 심리학적 개념이 단지 일반적으로 받아들여지는 신념이나 가정에서 도출된 것이 아니라, 확고하게 기반을 두고 있는지 확신하기 위해 증거를 찾는다.", "이러한 증거 기반 접근법에 더하여 심리학은 모든 인간에 의해 공유되는 근본적인 과정과 원리뿐만 아니라, 우리의 풍부한 문화적 사회적 다양성을 만들어 내는 것들을 다룬다.", "이것들은 현대 심리학이 무엇인지 보여 준다."], "sum": "사회에 떠도는 인간 본성에 대한 설명은 가정과 이야기의 혼합이지만, 심리학은 의견이 아닌 '증거'에 기반해 인간을 이해하는 과학이다. 또한 모든 인간이 공유하는 원리와 문화적 다양성을 낳는 과정을 함께 다룬다.", "key": ["통념 = 가정·이야기·때로는 어리석음의 혼합", "심리학 = 과학: 의견·소문·당대 통념·사상가의 의견(X) → 증거(O)", "증거 기반 + 인간 공통 원리와 문화·사회적 다양성 모두 탐구"], "mem": [4, 6], "tp": [["psychology as an evidence-based science of human behavior", "인간 행동에 관한 증거 기반 과학으로서의 심리학"], ["what distinguishes psychology from common beliefs about human nature", "심리학을 인간 본성에 대한 통념과 구별하는 것"]], "tt": [["Psychology: Science, Not Opinion", "심리학: 의견이 아닌 과학"], ["Beyond Hearsay: The Evidence Behind Psychology", "소문을 넘어: 심리학 뒤의 증거"]], "bl": [6, "they look for evidence", ["they rely on popular opinions", "they follow deep thinkers", "they accept common assumptions", "they collect interesting tales"]], "gr": [["is devoted to understanding people", "be devoted to + -ing (to는 전치사)"], ["how and why we act as we do", "as: ~하는 대로"], ["as well as those shared by all human beings", "A as well as B / 과거분사 후치 수식"]]}, {"src": "24년 10월 39번", "en": ["Life is what physicists might call a 'high-dimensional system,' which is their fancy way of saying that there's a lot going on.", "In just a single cell, the number of possible interactions between different molecules is enormous.", "Such a system can only hope to be stable if only a smaller number of collective ways of being may emerge.", "For example, it is only a limited number of tissues and body shapes that may result from the development of a human embryo.", "In 1942, the biologist Conrad Waddington called this drastic narrowing of outcomes canalization.", "The organism may switch between a small number of well-defined possible states, but can't exist in random states in between them, rather as a ball in a rough landscape must roll to the bottom of one valley or another.", "We'll see that this is true also of health and disease:", "there are many causes of illness, but their manifestations at the physiological and symptomatic levels are often strikingly similar."], "ko": ["생명은 물리학자들이 '고차원 시스템'이라고 부를 수 있는 것인데 이는 많은 일이 발생하고 있다고 말하는 그들의 멋진 방식이다.", "단 하나의 세포 내에서도 여러 분자 간의 가능한 상호 작용의 수는 매우 크다.", "이러한 시스템은 더 적은 수의 존재의 집합적인 방식이 나타날 때만 오직 안정적이기를 기대할 수 있다.", "예를 들어 인간 배아의 발달로부터 나올 수 있는 것은 오직 제한된 수의 조직과 신체 형태이다.", "1942년에 생물학자 Conrad Waddington은 이러한 극적인 결과의 축소를 '운하화'라고 불렀다.", "오히려 울퉁불퉁한 경관에 있는 공이 이 계곡 혹은 또 다른 계곡의 바닥으로 반드시 굴러가야 하는 것처럼, 유기체는 적은 수의 명확하게 정의된 가능한 상태 사이에서 바뀔 수 있지만 그것들 사이에 있는 무작위의 상태로 존재할 수는 없다.", "우리는 이것이 건강과 질병에도 적용된다는 것을 알게 될 것이다.", "즉 질병의 많은 원인이 있지만, 그것들의 생리적이고 증상적인 수준에서의 발현은 종종 놀랍도록 유사하다."], "sum": "생명은 상호작용이 엄청나게 많은 고차원 시스템이지만, 안정되려면 소수의 집합적 상태만 나타나야 한다. Waddington은 이런 결과의 극적 축소를 '운하화'라 불렀고, 질병도 원인은 많지만 증상은 비슷하게 나타난다.", "key": ["생명 = 고차원 시스템 (한 세포 안 분자 상호작용 수 막대)", "안정 = 소수의 집합적 방식만 출현 → 배아 발달 결과도 제한적 = 운하화(canalization)", "공이 계곡 바닥으로 구르듯 중간 상태 X → 질병: 원인은 다양, 발현은 유사"], "mem": [3, 8], "tp": [["canalization: how complex living systems settle into a few stable states", "운하화: 복잡한 생명 시스템이 소수의 안정 상태로 수렴하는 방식"], ["why diverse causes lead to similar outcomes in organisms", "생명체에서 다양한 원인이 비슷한 결과로 이어지는 이유"]], "tt": [["Many Causes, Few Outcomes", "원인은 많아도 결과는 적다"], ["Rolling into the Valley: Stability in Living Systems", "계곡으로 굴러가기: 생명 시스템의 안정성"]], "bl": [3, "only a smaller number of collective ways of being may emerge", ["countless random states can exist", "each molecule acts independently", "the number of interactions keeps increasing", "every outcome is equally possible"]], "gr": [["their fancy way of saying that ~", "동격의 that"], ["it is only a limited number of tissues ... that may result from ~", "It is ~ that 강조구문"], ["rather as a ball ... must roll", "as: ~처럼 (접속사)"]]}, {"src": "24년 10월 40번", "en": ["Punishing a child may not be effective due to what Alvaro Bilbao, a neuropsychologist, calls 'trick-punishments.'", "A trick-punishment is a scolding, a moment of anger or a punishment in the most classic sense of the word.", "Instead of discouraging the child from doing something, it encourages them to do it.", "For example, Hugh learns that when he hits his little brother, his mother scolds him.", "For a child who feels lonely, being scolded is much better than feeling invisible, so he will continue to hit his brother.", "In this case, his mother would be better adopting a different strategy.", "For instance, she could congratulate Hugh when he has not hit his brother for a certain length of time.", "The mother clearly cannot allow the child to hit his little brother, but instead of constantly pointing out the negatives, she can choose to reward the positives.", "In this way, any parent can avoid trick-punishments."], "ko": ["아이를 벌주는 것은 신경심리학자 Ávaro Bilbao가 '트릭 처벌'이라고 부르는 것으로 인해 효과적이지 않을 수 있다.", "트릭 처벌은 꾸짖음, 순간의 화 혹은 (처벌이라는) 단어의 가장 전형적인 의미에서의 처벌이다.", "아이가 무언가를 하는 것을 단념시키는 대신 트릭 처벌은 그들이 그것을 하도록 장려한다.", "예를 들어 Hugh는 그가 자신의 남동생을 때릴 때 그의 어머니가 그를 꾸짖는다는 것을 배운다.", "외로움을 느끼는 아이에게는 꾸중을 듣는 것이 눈에 띄지 않는다고 느끼는 것보다 훨씬 나아서 그는 그의 남동생을 때리는 것을 계속할 것이다.", "이 경우에, 그의 어머니는 다른 전략을 채택하는 것이 보다 나을 것이다.", "예를 들어 그녀는 Hugh가 그의 남동생을 일정 기간 동안 때리지 않았을 때 그를 자랑스러워해 줄 수 있다.", "어머니는 분명 아이가 그의 남동생을 때리는 것을 내버려둘 수 없고, 그녀는 부정적 측면을 계속 지적하는 대신에 긍정적 측면을 보상하는 것을 선택할 수 있다.", "이렇게 어느 부모도 트릭 처벌을 피할 수 있다."], "sum": "꾸중 같은 '트릭 처벌'은 외로운 아이에게 관심이 되어 오히려 나쁜 행동을 강화한다. 부정적인 것을 계속 지적하기보다 긍정적인 행동을 보상하는 것이 더 효과적이다.", "key": ["트릭 처벌 = 꾸중·화·처벌 → 행동을 막지 못하고 오히려 장려", "예: Hugh가 동생을 때림 → 꾸중(관심) > 투명인간 취급 → 계속 때림", "해결: 일정 기간 안 때리면 칭찬 → 긍정적인 행동 보상"], "mem": [3, 8], "tp": [["why punishment can encourage the very behavior it aims to stop", "처벌이 막으려는 행동을 오히려 부추길 수 있는 이유"], ["rewarding positive behavior instead of punishing negative behavior", "부정적 행동 처벌 대신 긍정적 행동 보상하기"]], "tt": [["When Scolding Backfires", "꾸중이 역효과를 낼 때"], ["Reward the Good, Don't Just Punish the Bad", "나쁜 것만 벌주지 말고 좋은 것을 보상하라"]], "bl": [8, "she can choose to reward the positives", ["she should punish him more strictly", "she can ignore both children", "she must scold him every time", "she should leave him alone"]], "gr": [["Instead of discouraging the child from doing something", "discourage + O + from -ing"], ["being scolded is much better than feeling invisible", "동명사 수동형 주어 / 비교급 강조 much"], ["would be better adopting", "would be better (off) -ing: ~하는 편이 낫다"]]}, {"src": "25년 10월 20번", "en": ["One of the most important aspects of sustaining long-term relationships is communication.", "It's easy to connect with someone and then let the relationship get stuck due to a lack of follow-up.", "To keep the connection alive, make a conscious effort to stay in touch.", "This doesn't mean constantly reaching out with requests or updates but rather maintaining a friendly and consistent line of communication.", "A simple message to check in or share something of value can go a long way in reinforcing your relationship.", "For example, if you come across an article or resource that you think might interest a connection, share it with them, even if you haven't spoken in a while.", "This shows that you're thinking of them and are invested in maintaining the relationship."], "ko": ["장기적인 관계를 유지하는 데 가장 중요한 측면 중 하나는 소통이다.", "누군가와 친해지고 나서 추후 연락 부족으로 인해 그 관계가 정체되도록 내버려 두기 쉽다.", "관계를 유지하기 위해, 연락하고 지내려는 의식적인 노력을 기울여라.", "이는 요청이나 최근 소식을 가지고 끊임없이 연락을 취하는 것이 아니라 오히려 친근하고 일관된 소통의 끈을 유지하는 것을 의미한다.", "안부를 확인하거나 가치 있는 무언가를 공유하는 간단한 메시지가 여러분의 관계를 강화하는 데 도움이 될 수 있다.", "예를 들어, 여러분이 자신과 관계가 있는 사람의 흥미를 끌 수 있다고 여기는 기사나 자료를 우연히 발견하면, 한동안 이야기하지 않았다고 할지라도 그들과 그것을 공유하라.", "이는 여러분이 그들을 생각하고 있으며 관계를 지속하는 데 노력을 쏟고 있다는 것을 보여 준다."], "sum": "장기적 관계 유지의 핵심은 소통이므로 의식적으로 연락을 유지하라. 끊임없는 요청이 아니라, 안부나 유용한 자료를 공유하는 간단한 메시지가 관계를 강화한다.", "key": ["장기적 관계 유지의 가장 중요한 측면 = 소통", "후속 연락 부족 → 관계 정체 → 의식적 노력으로 연락 유지", "요청·업데이트 남발(X), 친근하고 일관된 소통(O) — 예: 관심 있을 기사 공유"], "mem": [3, 5], "tp": [["the importance of consistent communication in long-term relationships", "장기적 관계에서 꾸준한 소통의 중요성"], ["small, regular contact as a way to strengthen relationships", "관계를 강화하는 방법으로서 작고 꾸준한 연락"]], "tt": [["Stay in Touch to Stay Connected", "관계를 이어 가려면 연락을 이어 가라"], ["A Simple Message Goes a Long Way", "간단한 메시지가 큰 힘이 된다"]], "bl": [4, "maintaining a friendly and consistent line of communication", ["asking for favors as often as possible", "meeting in person every single day", "avoiding contact until you need help", "sending long letters only on holidays"]], "gr": [["let the relationship get stuck", "사역동사 let + O + 동사원형"], ["This doesn't mean A but rather B", "not A but (rather) B"], ["can go a long way in reinforcing", "go a long way in -ing: ~하는 데 크게 도움이 되다"]]}, {"src": "25년 10월 21번", "en": ["Currently, urban regeneration projects in degraded areas have been promoted as improving the wellbeing of residents and solving environmental injustice problems.", "However, such environmental improvements in ethnic communities and/or low-income households can create an urban green space paradox.", "The creation of new, high-quality green spaces can increase attractiveness, making these neighbourhood more desirable.", "By contrast, the cost of housing can rise, and residents may not be able to afford the rent.", "This results in the exclusion or displacement of the poor neighbourhood's residents, who were intended to benefit from the ecosystem services provided by the new green space.", "In turn, the residents may only be able to afford to live in a similar degraded neighbourhood to the one they left, with low access to green infrastructure."], "ko": ["현재, 낙후된 지역에서 도시 재생 프로젝트는 거주자들의 복지를 향상시키고 환경적 불평등 문제를 해결하는 것으로서 추진되어 왔다.", "하지만, 소수 민족 공동체들 및/또는 저소득층 가구에서 그러한 환경 개선은 도시 녹색 공간의 역설을 만들 수 있다.", "새로운 양질의 녹색 공간의 조성은 매력을 증가시킬 수 있어 이 지역을 더 탐나게 만든다.", "대조적으로, 주거비가 오를 수 있고, 거주자들은 임대료를 지불할 여유가 없을지도 모른다.", "이는 가난한 지역 거주자들의 배제 혹은 퇴거를 야기하는데, 그들은 새로운 녹색 공간에 의해 제공되는 생태계 서비스로부터 혜택을 얻도록 의도되어 있었다.", "결국, 그 거주자들은 녹색 사회 기반 시설에 접근성이 낮은 채로, 그들이 떠났던 곳과 비슷한 낙후된 지역에나 거주할 형편이 될 수 있을지도 모른다."], "sum": "낙후 지역 도시 재생으로 녹지가 생기면 지역의 매력이 높아져 주거비가 오르고, 정작 혜택을 받아야 할 저소득 주민들이 쫓겨나 비슷한 낙후 지역으로 밀려나는 '녹색 공간의 역설'이 생긴다.", "key": ["도시 재생 = 주민 복지 향상·환경 불평등 해소 목적", "양질의 녹지 조성 → 지역 매력↑ → 주거비·임대료↑", "원주민 배제·이주 → 녹지 접근성 낮은 비슷한 낙후 지역으로 (녹색 공간의 역설)"], "mem": [2, 5], "tp": [["the unintended displacement of low-income residents caused by urban green spaces", "도시 녹지가 초래하는 저소득층 주민의 의도치 않은 이주"], ["the paradox of urban regeneration projects", "도시 재생 사업의 역설"]], "tt": [["The Green Space Paradox", "녹색 공간의 역설"], ["Greener Neighborhoods, Displaced Residents", "더 푸른 동네, 쫓겨나는 주민들"]], "bl": [5, "the exclusion or displacement of the poor neighbourhood's residents", ["a decrease in housing costs", "the improvement of residents' wellbeing", "an increase in local job opportunities", "better access to green infrastructure"]], "gr": [["have been promoted as improving ~", "현재완료 수동 / as + 동명사"], ["making these neighbourhood more desirable", "결과의 분사구문 + make O C(형용사)"], ["who were intended to benefit from ~", "계속적 용법 관계대명사 / be intended to V"]]}, {"src": "25년 10월 22번", "en": ["An increasing awareness of our effect on the ocean is slowly seeping into the public agenda, dragging behind it a conversation that is decades overdue.", "But this conversation faces a massive obstacle.", "It's almost impossible to discuss what to do about something changing if you don't initially know how it works.", "If a doctor tells a patient that they have a problem with their kidneys, the patient probably already has at least a vague idea about where their kidneys are and what they're up to.", "They learned about that part of their own personal life-support system at school.", "But that's not the case for the oceans.", "When we see a news story about the long-term decline in the numbers of krill in the Southern Ocean, it sounds generally like a bad thing.", "But there's far more to it than the risk of whales going hungry.", "Krill are a part of the ocean engine.", "We need to understand at least some of the context before we can discuss the change and take appropriate action."], "ko": ["해양에 미치는 우리의 영향에 대한 커지는 인식이 공공 안건으로 서서히 스며들면서, 수십 년 동안 미뤄 온 대화를 그것 뒤로 끌고 온다.", "하지만 이 대화는 거대한 장애물을 직면한다.", "만약 여러분이 그것이 어떻게 작동하는지를 애초에 알지 못한다면 변화하는 어떤 것에 대해 무엇을 해야 할지를 논의하는 것은 거의 불가능하다.", "만약 의사가 환자에게 신장에 문제가 있다고 말한다면, 그 환자는 아마도 신장이 어디에 있고 무엇을 하는지에 대해 적어도 막연한 이해는 이미 가지고 있을 것이다.", "그들은 학교에서 자기 개인의 생명 유지 체계의 그 부분에 대해 배웠다.", "하지만 해양의 경우는 그렇지 않다.", "우리가 남극해 크릴 수의 장기적 감소에 대한 신문 기사를 볼 때, 일반적으로 그것은 나쁜 일처럼 들린다.", "하지만 거기에는 고래가 굶주리는 위험보다 훨씬 더 많은 것이 있다.", "크릴은 해양 엔진의 일부이다.", "우리는 변화에 대해 논의하고 적절한 조치를 취할 수 있기 전에 최소한 어느 정도의 맥락은 이해할 필요가 있다."], "sum": "해양에 대한 인간의 영향이 공론화되고 있지만, 바다가 어떻게 작동하는지 모르면 변화에 대해 논의할 수 없다. 신장과 달리 바다는 학교에서 배우지 않으므로, 행동하기 전에 최소한의 맥락을 이해해야 한다.", "key": ["해양 영향에 대한 인식↑ → 늦어진 대화 시작, 그러나 거대한 장애물", "작동 원리를 모르면 논의 불가 (신장은 학교에서 배움 ↔ 바다는 아님)", "크릴 감소 = 고래 굶주림 이상의 문제(해양 엔진의 일부) → 맥락 이해가 먼저"], "mem": [3, 10], "tp": [["the need to understand how the ocean works before addressing its changes", "해양 변화에 대처하기 전 해양의 작동 원리를 이해할 필요성"], ["lack of basic ocean knowledge as an obstacle to public discussion", "공적 논의의 장애물인 기본 해양 지식의 부족"]], "tt": [["Know the Ocean Before You Fix It", "바다를 고치기 전에 바다를 알라"], ["Krill and the Ocean Engine", "크릴과 해양 엔진"]], "bl": [3, "if you don't initially know how it works", ["if you have too much scientific data", "if the public is already aware of it", "if the change happens very slowly", "if experts disagree with each other"]], "gr": [["dragging behind it a conversation that is decades overdue", "분사구문 + 목적어 후치(behind it이 앞으로)"], ["It's almost impossible to discuss what to do", "가주어 it–진주어 to V / 의문사 + to V"], ["there's far more to it than ~", "비교급 강조 far"]]}, {"src": "25년 10월 23번", "en": ["Rome was said to have been a melting pot from the very start.", "The historian Livy claimed the city's original population was comprised of immigrants flooding in from all directions, attracted by Romulus's deliberate policy of nondiscrimination.", "It was this initial openness, Livy asserts, that laid the foundations for the later strength and success of the city.", "Romans described their city as multicultural in the generations after its foundation.", "Tradition held that only a minority of the city's legendary kings were Roman-born, with the others all arriving as immigrants before being chosen for the throne for their virtues and merits.", "As the empire expanded across three continents, Rome eagerly adopted new cultural influences and absorbed incoming groups — perhaps a little too eagerly for some, who, like the poet Juvenal, complained about the rapid rate of cultural change."], "ko": ["로마는 맨 처음부터 용광로였다고 일컬어졌다.", "역사학자 Livy는 그 도시의 원래 인구가 Romulus의 의도적인 비차별 정책에 의해 이끌려 사방에서 몰려든 이민자들로 구성되었다고 주장했다.", "Livy가 주장하길, 그 도시의 이후의 힘과 성공을 위한 토대를 놓은 것은 바로 이러한 초기의 개방성이었다.", "로마인들은 도시의 설립 이후 여러 세대에 걸쳐 자신들의 도시를 다문화적이라고 묘사했다.", "전통적으로, 그 도시의 전설적인 왕들 중 소수만이 로마 태생이었고, 나머지 왕들은 그들의 덕성과 공로로 왕위에 선택되기 전에 모두 이민자로 이주해 왔다고 한다.", "제국이 세 대륙에 걸쳐 확장되면서, 로마는 적극적으로 새로운 문화적 영향을 채택하였고, 유입되는 집단들을 흡수했다. 이것은 아마도 어떤 사람들에게는 다소 지나치게 적극적이었을지도 모르는데, 그들은 시인 Juvenal처럼 그 급격한 문화 변화 속도에 대해 불평했다."], "sum": "로마는 처음부터 이민자를 차별 없이 받아들인 다문화 도시였고, Livy는 이 초기의 개방성이 이후 로마의 힘과 성공의 토대가 되었다고 주장했다. 로마는 제국 확장 후에도 새로운 문화를 적극 흡수했다.", "key": ["Livy: 원래 인구 = 사방에서 온 이민자 (Romulus의 의도적 비차별 정책)", "초기의 개방성 → 이후 힘과 성공의 토대", "전설적 왕들 대부분 이민자 출신 / 제국 확장 시 새 문화 흡수 (Juvenal은 급변에 불평)"], "mem": [3, 6], "tp": [["openness to immigrants as the foundation of Rome's strength", "로마 힘의 토대로서 이민자에 대한 개방성"], ["Rome's multicultural identity from its beginning", "시작부터 이어진 로마의 다문화적 정체성"]], "tt": [["Rome: A Melting Pot from the Start", "로마: 처음부터 용광로"], ["How Openness Built an Empire", "개방성은 어떻게 제국을 세웠나"]], "bl": [3, "this initial openness", ["strict military discipline", "the rejection of foreigners", "geographical isolation", "the power of Roman-born kings"]], "gr": [["was said to have been a melting pot", "완료부정사: 주절보다 앞선 시제"], ["It was this initial openness ... that laid the foundations", "It was ~ that 강조구문"], ["before being chosen for the throne", "전치사 + 동명사 수동형"]]}, {"src": "25년 10월 24번", "en": ["The laws and constants of physics and the fundamental forces in our universe have very precise forms and values.", "This means that, if they were only very slightly different, life would not have been possible.", "For instance, the precise value of gravity has enabled our universe to arise by permitting the aggregation of dust and gas particles to proto-stars around which planets later came to orbit, including the Earth around the Sun.", "If the value of the electron had been ever so slightly larger or smaller, chemistry, as we know it, would not have been possible and life, which is based on organic chemistry, could not have started.", "The universe was not designed for us to evolve, we have no privileged position in the universe; however, the laws and constants of physics allowed advanced life to evolve."], "ko": ["물리학 법칙들과 상수들 그리고 우리 우주의 근본 힘들은 매우 정밀한 공식의 형태들과 값들을 가진다.", "이는, 만약 그것들이 아주 약간만 다르다면, 생명체가 가능하지 않았을 것임을 의미한다.", "예를 들어, 중력의 정밀한 값은 태양 주위의 지구를 포함하여 행성들이 나중에 그 주위를 공전하게 되는 원시 항성들로 먼지와 가스 입자들이 응집하는 것을 허용함으로써 우리 우주가 생겨나는 것을 가능하게 했다.", "만약 전자의 값이 아주 약간이라도 더 크거나 작았더라면, 우리가 알고 있는 대로의 화학 반응은 가능하지 않았을 것이며 유기 화학 반응에 기반을 둔 생명체는 시작될 수 없었을 것이다.", "우주는 우리가 진화하도록 설계되지 않았고, 우리는 우주에서 어떠한 특권적인 지위를 가지지 않는다. 그러나, 물리학 법칙들과 상수들은 고등 생명체가 진화하는 것을 가능하게 했다."], "sum": "물리 법칙과 상수는 매우 정밀한 값을 가지며, 조금만 달랐어도 생명은 불가능했을 것이다. 우주가 우리를 위해 설계된 것은 아니지만, 그 법칙과 상수 덕분에 고등 생명체가 진화할 수 있었다.", "key": ["물리 법칙·상수·근본 힘 = 매우 정밀 → 약간만 달라도 생명 불가", "중력: 먼지·가스 응집 → 원시 항성 → 행성 공전 / 전자의 값 → 화학 → 유기화학 기반 생명", "우주는 인간을 위해 설계되지 않음(특권 X), 그러나 법칙과 상수가 진화를 허용"], "mem": [2, 5], "tp": [["how the precise values of physical laws made life possible", "물리 법칙의 정밀한 값이 생명을 가능하게 한 방식"], ["the delicate conditions of the universe that allowed life to evolve", "생명의 진화를 허용한 우주의 섬세한 조건"]], "tt": [["A Universe Just Right for Life", "생명에 딱 맞는 우주"], ["If Gravity Were Different: The Precision Behind Life", "중력이 달랐다면: 생명 뒤의 정밀함"]], "bl": [2, "if they were only very slightly different", ["if humans had not existed", "if the universe were designed for us", "if planets orbited faster", "if gravity were completely removed"]], "gr": [["if they were ... different, life would not have been possible", "혼합가정법 (if + 과거, would have p.p.)"], ["If the value of the electron had been ..., chemistry ... would not have been possible", "가정법 과거완료"], ["around which planets later came to orbit", "전치사 + 관계대명사"]]}, {"src": "25년 10월 29번", "en": ["Human beings have evolved to make the most of the resources available to them in ways that are subtle and complicated.", "When we change our diets, especially when we do so quickly, we are effectively conducting huge experiments in nutrition.", "We ought to have more humility.", "Nutritional science is still young and there is so much we do not know.", "If we have eaten certain foods in certain ways for millennia, we should assume until it is proven otherwise that there is probably a good reason why.", "Traditional foods that don't fit neatly on the contemporary dietary food plate should generally be chosen over highly processed ones that do.", "We should assume that traditionally made fatty blood sausages are preferable to lean, factory-made salamis; that spoonfuls of honey are superior to sprinkles of sweeteners.", "Witnessing how poorly traditional societies are faring as they undergo a nutrition transition should make those who have already completed it question whether their diets have moved too far."], "ko": ["인간은 그들에게 이용 가능한 자원들을 미묘하고 복잡한 방식들로 최대한 이용하도록 진화해 왔다.", "우리가 우리의 식단을 바꿀 때, 특히 우리가 매우 빠르게 그렇게 할 때, 우리는 실질적으로 영양 섭취에서 거대한 실험을 시행하고 있는 것이다.", "우리는 더 겸손해져야 한다.", "영양학은 여전히 역사가 짧고 우리가 모르는 것이 너무나 많다.", "만약 우리가 수천 년 동안 특정한 방식들로 특정한 음식들을 먹어 왔다면, 우리는 그것이 다르게 증명될 때까지는 아마도 그렇게 하는 타당한 이유가 있을 것이라고 추측해야 한다.", "일반적으로 현대의 균형 잡힌 식단의 식사에 딱 들어맞지 않는 전통 음식이 딱 들어맞는 매우 가공된 음식보다 우선 선택되어야 한다.", "우리는 전통적으로 만들어진 지방이 많은 블러드 소시지가 지방이 적고 공장에서 만들어진 살라미 소시지보다 더 선호되며, 그리고 몇 스푼의 꿀이 소량의 감미료보다 더 나은 것으로 추측해야 한다.", "전통 사회들이 영양 전환을 겪으면서 얼마나 형편없이 살아가고 있는지를 목격하는 것은 이미 그것(전환)을 완료한 이들로 하여금 자신들의 식단이 너무 멀리 간 것은 아닌지 의문을 제기하도록 만들어야 할 것이다."], "sum": "영양학은 아직 역사가 짧으므로 식단을 급격히 바꾸는 것에 겸손해야 한다. 수천 년간 먹어 온 음식에는 타당한 이유가 있다고 가정하고, 고도로 가공된 음식보다 전통 음식을 선택해야 한다.", "key": ["식단 변화(특히 빠른 변화) = 영양에 대한 거대한 실험", "영양학은 젊은 학문 → 겸손 필요, 오래 먹어 온 방식에는 이유가 있다고 가정", "전통 음식 > 고도 가공 음식 (블러드 소시지 > 공장 살라미, 꿀 > 감미료)"], "mem": [5, 6], "tp": [["the wisdom of traditional diets over modern processed foods", "현대 가공식품보다 나은 전통 식단의 지혜"], ["why we should be humble about changing our diets", "식단을 바꾸는 데 겸손해야 하는 이유"]], "tt": [["Trust the Wisdom of Traditional Foods", "전통 음식의 지혜를 믿어라"], ["Have Our Diets Gone Too Far?", "우리의 식단은 너무 멀리 와 버렸나?"]], "bl": [5, "there is probably a good reason why", ["we should replace them immediately", "modern science has proven them harmful", "they were only eaten by accident", "processed food is always healthier"]], "gr": [["We ought to have more humility", "ought to + 동사원형 = should"], ["should assume until it is proven otherwise that ~", "until절 삽입, assume의 목적어는 that절"], ["Witnessing how poorly ... should make those who ~ question", "동명사 주어 + make O 동사원형"]]}, {"src": "25년 10월 30번", "en": ["While convenience and technology are crucial, they are not the only factors driving Gen Z's financial decisions.", "This generation is incredibly values-driven, and they want to bank with institutions that match their personal beliefs and values.", "Transparency is vital.", "Gen Z is skeptical of large corporations and institutions that lack accountability.", "They have grown up in a world where information is freely available, and they expect complete transparency from the brands they support.", "Banks, for example, must clearly communicate fees, terms, and conditions, as well as how they handle customers' data.", "Moreover, ethical banking practices are more important than ever.", "Gen Z cares about the environment, social justice, and the ethical implications of their financial decisions.", "They are interested in sustainable investing, supporting businesses that match their values, and ensuring that their money is not being used to fund harmful practices.", "Banks that offer socially responsible investment opportunities and are committed to environmental sustainability will attract Gen Z's attention."], "ko": ["편리함과 기술이 중요하지만, 그것들이 Z세대의 재정상 결정을 이끄는 유일한 요인들은 아니다.", "이 세대는 매우 가치 지향적이며, 개인의 신념과 가치에 부합하는 기관과 거래하기를 원한다.", "투명성이 매우 중요하다.", "Z세대는 책무성이 부족한 대규모의 기업과 기관에 회의적이다.", "그들은 정보를 자유롭게 이용할 수 있는 세상에서 자라 왔고, 자신이 지지하는 브랜드로부터 완전한 투명성을 기대한다.", "예를 들어, 은행은 그들이 고객의 데이터를 처리하는 방식뿐 아니라 수수료, 약관, 조항을 투명하게 전달해야 한다.", "게다가, 윤리적인 은행 업무는 그 어느 때보다 중요하다.", "Z세대는 환경, 사회 정의, 그리고 자신의 재정상 결정의 윤리적 함의에 관심이 있다.", "그들은 지속 가능한 투자, 자신의 가치에 부합하는 기업을 지지하는 것, 그리고 자신의 돈이 유해한 관행에 자금을 대는 데 사용되고 있지 않음을 확실히 하는 것에 관심이 있다.", "사회적으로 책임 있는 투자 기회를 제공하고 환경적 지속 가능성에 전념하는 은행은 Z세대의 관심을 끌 것이다."], "sum": "Z세대는 편리함과 기술뿐 아니라 가치를 중시하여 자신의 신념에 맞는 금융 기관과 거래하려 한다. 그들은 투명성과 윤리적 은행 업무를 요구하며, 사회적 책임과 지속 가능성에 전념하는 은행에 끌린다.", "key": ["Z세대 = 가치 지향적 (신념·가치에 맞는 기관 선택)", "투명성: 수수료·약관·고객 데이터 처리 방식을 명확히 공개", "윤리성: 환경·사회 정의·지속 가능한 투자 → 책임 있는 은행이 관심을 끎"], "mem": [2, 10], "tp": [["the values-driven financial choices of Gen Z", "Z세대의 가치 중심적 금융 선택"], ["transparency and ethics as key factors for banks to attract Gen Z", "Z세대를 끌기 위한 은행의 핵심 요소인 투명성과 윤리"]], "tt": [["Gen Z Banks on Values", "Z세대는 가치에 투자한다"], ["More Than Convenience: What Gen Z Wants from Banks", "편리함 그 이상: Z세대가 은행에 원하는 것"]], "bl": [2, "match their personal beliefs and values", ["offer the highest interest rates", "have the longest history", "provide only mobile services", "are located near their homes"]], "gr": [["they are not the only factors driving ~", "현재분사 후치 수식"], ["They have grown up in a world where ~", "관계부사 where"], ["ensuring that their money is not being used", "진행형 수동태 (be being p.p.)"]]}, {"src": "25년 10월 31번", "en": ["Myths aren't only stories.", "For example, a well-known myth that persists today is the supposed high iron content in spinach.", "This is a legend that dates back to 1890 and originates from a simple miscalculation by physiologist Gustav von Bunge.", "He accurately determined that 100 grams of spinach contained 35 milligrams of iron but he was analyzing dried spinach, which held ten times more iron than the same amount of fresh leafy greens.", "Although the error was swiftly corrected, the correction was just as swiftly forgotten.", "The myth had taken hold.", "Popeye, who gained superhuman strength from the leafy greens and defended himself with iron fists, contributed to its endurance and even today, some nearly 150 years later, parents the world over use this tale to try to persuade their children into eating the healthy vegetable."], "ko": ["통념은 단지 이야기가 아니다.", "예를 들어, 오늘날에도 지속되는 잘 알려진 하나의 통념은 시금치에 있다고 여겨지는 높은 철분 함량이다.", "이것은 1890년으로 거슬러 올라가 생리학자 Gustav von Bunge의 단순한 계산 착오에서 비롯된 전해오는 이야기이다.", "그가 시금치 100그램이 철분 35밀리그램을 함유하고 있다는 사실을 정확하게 밝혀냈지만, 그는 말린 시금치를 분석하고 있었고, 그것은 같은 양의 말리지 않은 푸른잎채소(시금치)보다 열 배 많은 철분을 갖고 있었다.", "그 오류는 빠르게 수정되었지만 그 수정은 그만큼 빠르게 잊혀졌다.", "이 통념은 확고히 자리를 잡았다.", "Popeye는 푸른잎채소(시금치)에서 초인적인 힘을 얻고 강철 주먹으로 자신을 방어했기에, 그것의 지속에 기여했고, 약 150년이 지난 오늘날에도 전 세계 부모들은 자녀들이 건강한 그 채소를 먹도록 설득하기 위해 이 이야기를 이용한다."], "sum": "시금치에 철분이 많다는 통념은 1890년 von Bunge가 '말린' 시금치를 분석한 계산 착오에서 비롯되었다. 오류는 곧 수정됐지만 수정은 잊혔고, 뽀빠이 덕분에 지금까지 이어지고 있다.", "key": ["통념은 단순한 이야기가 아님 (예: 시금치의 높은 철분 함량)", "1890 von Bunge: 100g당 35mg은 정확했지만 말린 시금치(생 시금치의 10배) 분석", "오류는 빨리 수정, 그러나 수정은 빨리 잊힘 → 뽀빠이로 통념 지속, 부모들이 지금도 이용"], "mem": [5, 6], "tp": [["how a simple error created a lasting myth about spinach", "단순한 오류가 시금치에 대한 오랜 통념을 만든 과정"], ["why myths persist even after they are corrected", "통념이 수정된 후에도 지속되는 이유"]], "tt": [["The Iron Myth of Spinach", "시금치 철분 신화"], ["Popeye's Mistake: How a Miscalculation Became a Legend", "뽀빠이의 착각: 계산 착오가 전설이 되기까지"]], "bl": [5, "the correction was just as swiftly forgotten", ["the correction became even more famous", "scientists never noticed the error", "spinach lost its popularity", "the myth disappeared immediately"]], "gr": [["a legend that dates back to 1890", "date back to: ~로 거슬러 올라가다"], ["which held ten times more iron than ~", "배수사 + 비교급 + than"], ["The myth had taken hold.", "과거완료: 기준 시점보다 앞서 자리 잡음"]]}, {"src": "25년 10월 32번", "en": ["The technical term often used to describe animals' judgement of numbers is the aproximate number system.", "What it does not provide is precision.", "It shows — and this is the same in every species tested — a characteristic pattern of errors, with discrimination becoming less accurate as the quantities get bigger.", "Rhesus monkeys can tell one from two, two from three, three from four, four from five ... but start to fail from five upwards.", "Rats that learned to press a lever a given number of times, from four up to twenty-four, became markedly less and less precise in their responses as the number increased:", "by the top end of the range they would merely produce a spread of numbers around the target.", "It is a common observation that when testing the accuracy of animals' number sense, the size of the numbers matters."], "ko": ["동물들의 수에 대한 분별력을 기술하는 데 자주 사용되는 전문 용어는 '어림 수 짐작 능력'이다.", "그것이 제공하지 않는 것은 정확성이다.", "그것은 수량이 더 커질수록 판별이 덜 정확해지는 특징적인 오류 패턴을 보여 주는데, 이것은 실험된 모든 종에서 동일하다.", "붉은털원숭이는 1과 2, 2와 3, 3과 4, 4와 5는 구별할 수 있지만, 5 위로는 실패하기 시작한다.", "네 번에서 스물네 번까지 주어진 횟수만큼 레버를 누르도록 학습했던 쥐는 숫자가 커질수록 그들의 반응에 있어서 두드러지게 점점 덜 정확해졌다.", "그 범위의 상한선에 다다랐을 때, 그들은 단지 목표(숫자) 주변에 퍼져 있는 숫자들을 산출하곤 했다.", "동물의 수 감각의 정확성을 측정할 때, 숫자의 크기가 중요하다는 것은 공통된 관찰이다."], "sum": "동물의 수 판단 능력인 '어림 수 체계'는 정확성을 제공하지 않으며, 수량이 커질수록 판별이 덜 정확해지는 공통된 오류 패턴을 보인다. 동물의 수 감각을 측정할 때 숫자의 크기가 중요하다.", "key": ["어림 수 체계(approximate number system) = 정확성 X", "실험한 모든 종에서 공통: 수량↑ → 판별 정확도↓", "붉은털원숭이 5 이상부터 실패 / 쥐: 숫자가 클수록 목표 주변으로 퍼진 반응"], "mem": [3, 7], "tp": [["the decreasing accuracy of animals' number sense as quantities increase", "수량이 커질수록 떨어지는 동물 수 감각의 정확성"], ["the approximate nature of animals' numerical judgment", "동물 수 판단의 어림적 특성"]], "tt": [["Bigger Numbers, Bigger Mistakes", "숫자가 커질수록 실수도 커진다"], ["Can Animals Count? Only Roughly", "동물은 셀 수 있을까? 대충만"]], "bl": [7, "the size of the numbers matters", ["the species of the animal is irrelevant", "animals count as precisely as humans", "the reward size is the only factor", "training time does not matter"]], "gr": [["What it does not provide is precision.", "what 명사절 주어 → 단수 동사 is"], ["with discrimination becoming less accurate as ~", "with + O + -ing / as: ~함에 따라"], ["Rats that learned to press ... became", "주어 Rats + 관계사절 → 동사 became"]]}, {"src": "25년 10월 33번", "en": ["Despite the cultural trope depicting emotions as the opposite of rational thought, cognition ― what we commonly refer to as thinking ― is actually a key building block of emotion.", "How we think about our circumstances shapes the emotions we experience; then those emotions echo back to influence how we think.", "For instance, if you walk into a test thinking you are bad at taking tests, your anxiety will be increased.", "Then you don't feel good about your performance on the test, and that becomes evidence for continuing to think that you're bad at test taking.", "In this way there's simply no pulling emotion and cognition apart.", "This bi-directionality of cognition and emotion allows us to adjust difficult emotions by changing the way we think.", "By thinking differently — I get nervous sometimes, but I'm still a good test taker, or that nervous feeling is just excitement and anticipation, it means I'm ready — you can work those pathways to your advantage."], "ko": ["감정을 합리적인 사고의 반대로 묘사하는 문화적인 비유적 표현에도 불구하고, 우리가 흔히 생각이라고 일컫는 것, 즉 인지는 사실 감정의 핵심 구성 요소이다.", "우리가 우리의 상황에 대해 '생각하는' 방식은 우리가 경험하는 감정을 형성한다. 그 다음에 그 감정들은 반향되어 우리가 생각하는 방식에 영향을 미친다.", "예를 들어, 만약 여러분이 시험 보는 것을 잘 못한다고 생각하며 시험을 보러 걸어 들어간다면, 여러분의 불안은 증가할 것이다.", "그러면 여러분은 그 시험에서 자신의 수행에 대해 기분이 좋지 않고, 그것은 여러분이 시험 보는 것을 잘 못한다고 '생각하는' 것을 지속하는 근거가 된다.", "이런 식으로 감정과 인지는 결코 분리할 수 없다.", "인지와 감정의 이러한 양방향성은 우리가 생각하는 방식을 바꿈으로써 어려운 감정들을 조정하는 것을 가능하게 한다.", "'나는 때때로 긴장하지만, 여전히 시험 보는 것을 잘하는 사람이다.' 혹은 '그 긴장되는 느낌은 단지 흥분과 기대이며, 그것은 내가 준비되었다는 것을 의미한다.'라고 다르게 생각함으로써, 여러분은 그러한 경로들을 여러분에게 유리하게 작동시킬 수 있다."], "sum": "감정은 이성의 반대가 아니라, 인지(생각)가 감정의 핵심 구성 요소이며 둘은 서로 영향을 주고받는다. 이 양방향성 덕분에 생각하는 방식을 바꿔 어려운 감정을 조절할 수 있다.", "key": ["통념(감정 ↔ 이성은 반대) X → 인지 = 감정의 핵심 구성 요소", "생각 → 감정 → 다시 생각 (예: '난 시험을 못 봐' → 불안 → 결과 나쁨 → 확신 강화)", "양방향성 → 생각을 바꿔 감정 조절 ('긴장 = 준비되었다는 신호')"], "mem": [2, 6], "tp": [["the two-way relationship between cognition and emotion", "인지와 감정의 양방향 관계"], ["changing how we think to manage difficult emotions", "생각을 바꿔 어려운 감정을 다스리기"]], "tt": [["Change Your Thoughts, Change Your Feelings", "생각을 바꾸면 감정이 바뀐다"], ["Thinking and Feeling: Inseparable Partners", "생각과 감정: 떼려야 뗄 수 없는 짝"]], "bl": [6, "adjust difficult emotions by changing the way we think", ["ignore our emotions completely", "separate emotion from cognition", "avoid taking difficult tests", "rely only on rational thought"]], "gr": [["what we commonly refer to as thinking", "refer to A as B: A를 B라고 부르다"], ["there's simply no pulling emotion and cognition apart", "There is no -ing: ~하는 것은 불가능하다"], ["By thinking differently", "by + -ing: ~함으로써"]]}, {"src": "25년 10월 34번", "en": ["What is the Capabilities Approach (CA), and why would lawyers passionate about animal justice care about it?", "It is easy to say what it is not.", "The CA does not rank animals by likeness to humans or seek special privileges for those considered most \"like us,\" as do some other popular theoretical approaches.", "The CA has concern for the finch and the pig as much as the whale and the elephant.", "And it argues that the human form of life is simply irrelevant when we think about what each type of animal needs and deserves.", "What is relevant is their own forms of life.", "Just as humans seek to be able to enjoy the characteristic goods of a human life, so a finch seeks a finch's life and the whale a whale's life.", "We should extend ourselves and learn, not lazily picture animals as lesser humans, seeking a life sort of like our own.", "According to the CA, each sentient creature should have the opportunity to flourish in the form of life characteristic for that creature."], "ko": ["능력 접근법(CA)이란 무엇이며, 동물 정의에 열정을 가진 법률가들이 왜 그것에 관심을 가질까?", "그것이 아닌 것을 말하는 것이 쉽다.", "CA는 다른 널리 퍼진 이론적 접근들이 그러하듯, 동물들을 인간과의 유사성에 따라 순위를 매기거나 가장 '우리와 비슷한' 존재로 여겨지는 동물에게 각별한 특권을 부여하려 하지 않는다.", "CA는 고래와 코끼리에게만큼이나 핀치와 돼지에게도 관심을 가진다.", "그리고 그것은 우리가 각 종류의 동물이 필요로 하고 마땅히 누려야 할 것에 대해 생각할 때, 인간의 삶의 형태는 그저 무관하다고 주장한다.", "관련이 있는 것은 '그들 고유의' 삶의 형태이다.", "꼭 인간이 인간다운 삶의 고유한 좋은 것들을 누릴 수 있기를 추구하는 것처럼, 핀치는 핀치의 삶을, 고래는 고래의 삶을 추구한다.", "우리는 스스로를 확장하고 배워야 하며, 동물들을 열등한 인간으로, 우리와 같은 식의 삶을 추구한다고 성의 없이 상상해서는 안 된다.", "CA에 따르면, 지각 능력이 있는 각각의 생명체는 그 생명체에게 고유한 삶의 형태로 번영할 기회를 가져야 한다."], "sum": "능력 접근법(CA)은 동물을 인간과의 유사성으로 서열화하지 않고, 각 동물이 자기 고유의 삶의 형태 속에서 번영할 기회를 가져야 한다고 주장한다.", "key": ["CA는 인간과의 유사성으로 동물 순위 매기기 X (핀치·돼지도 고래·코끼리만큼 중요)", "인간의 삶의 형태는 무관 → 각 동물 고유의 삶의 형태가 중요", "동물을 열등한 인간으로 보지 말 것 → 모든 지각 있는 생명체가 고유한 방식으로 번영할 기회"], "mem": [6, 9], "tp": [["the Capabilities Approach's respect for each animal's own form of life", "각 동물 고유의 삶의 형태를 존중하는 능력 접근법"], ["why animals should not be judged by their likeness to humans", "동물을 인간과의 유사성으로 판단해서는 안 되는 이유"]], "tt": [["Let a Finch Live a Finch's Life", "핀치는 핀치답게 살게 하라"], ["Justice for Animals on Their Own Terms", "동물 그들 방식대로의 정의"]], "bl": [6, "their own forms of life", ["their similarity to humans", "their intelligence level", "their usefulness to people", "their size and strength"]], "gr": [["as do some other popular theoretical approaches", "as + 대동사 do + 주어 (도치)"], ["Just as A, so B", "꼭 A인 것처럼 B도 그렇다"], ["not lazily picture animals as lesser humans", "picture A as B: A를 B로 상상하다"]]}, {"src": "25년 10월 35번", "en": ["Social media serves as an important context to facilitate autobiographical remembering.", "Personal events posted on social media platforms are better remembered and less forgotten than those not posted, independent of the characteristics of the events.", "This may be because sharing memories online allows individuals to rehearse and make sense of what happened, thus facilitating long-term memory retention.", "Online feedback such as comments and likes as well as technological features such as algorithms and periodic reminders can further serve as memory cues for the posted event details.", "As a result, event details shared on social media are likely stabilized and remembered over time, whereas those not shared may become inaccessible or forgotten."], "ko": ["소셜 미디어는 자전적 기억을 촉진하는 중요한 맥락으로 작용한다.", "소셜 미디어 플랫폼에 게시된 개인적 사건들은 그 사건들의 특성과 무관하게, 게시되지 않은 것들보다 더 잘 기억되고 덜 잊힌다.", "이것은 온라인에서 기억을 공유하는 것이 개인이 일어난 일을 되풀이하고 이해하도록 해서 장기 기억 유지를 촉진하기 때문일 수 있다.", "알고리즘과 주기적인 알림과 같은 기술적 기능들뿐만 아니라, 댓글과 좋아요와 같은 온라인 피드백도 게시된 사건의 세부 사항에 대한 기억 단서로 한층 더 작용할 수 있다.", "그 결과, 소셜 미디어에 공유된 사건 세부 사항들은 시간이 지나면서 안정화되고 기억될 가능성이 높은 반면에, 공유되지 않은 것들은 접근할 수 없게 되거나
