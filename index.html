 잊힐 수 있다."], "sum": "소셜 미디어에 게시한 개인적 사건은 게시하지 않은 것보다 더 잘 기억된다. 온라인 공유가 사건을 되새기고 의미를 부여하게 하며, 댓글·좋아요·알림 등이 기억 단서로 작용하기 때문이다.", "key": ["소셜 미디어 = 자전적 기억을 촉진하는 맥락", "게시된 사건 → 사건 특성과 무관하게 더 잘 기억 ← 되새기기(리허설)·의미 부여", "댓글·좋아요·알고리즘·주기적 알림 = 기억 단서 → 공유된 것은 안정화, 아닌 것은 망각"], "mem": [2, 5], "tp": [["how sharing on social media enhances autobiographical memory", "소셜 미디어 공유가 자전적 기억을 강화하는 방식"], ["the role of online feedback as memory cues", "기억 단서로서 온라인 피드백의 역할"]], "tt": [["Post It, Remember It", "올리면 기억된다"], ["Social Media: Your Memory's New Notebook", "소셜 미디어: 기억의 새로운 공책"]], "bl": [3, "rehearse and make sense of what happened", ["forget unpleasant experiences", "exaggerate their daily events", "compare themselves with others", "hide their personal lives"]], "gr": [["are better remembered and less forgotten than ~", "수동태 + 비교급 병렬"], ["independent of the characteristics of the events", "independent of: ~와 무관하게"], ["A as well as B can further serve as ~", "A as well as B (동사는 A에 일치) / serve as"]]}, {"src": "25년 10월 36번", "en": ["Multisensory experiences are a central part of our everyday lives, yet we often take them for granted, especially when our senses function normally or are corrected to normal with aids like glasses.", "However, closer inspection to any, even the most ordinary experiences, reveals the remarkable multisensory world in which we live.", "Consider the experience of eating a regular meal.", "At first, it may seem like an ordinary experience, but it is actually a fusion of the senses.", "We first eat with our eyes, but we are also exposed to countless sensory signals that influence our eating experience such as food textures, tastes, and smells.", "And it does not stop there.", "Even the sounds that come both from the atmospheres in which we eat and our interactions with the food (such as chewing) and the tools we use to eat influence our eating experience."], "ko": ["다중 감각 경험은 우리 일상생활의 주요한 부분이지만, 우리는 특히 감각이 정상적으로 작동하거나 안경과 같은 보조 도구로 정상으로 교정될 때 그것들을 종종 당연하게 여긴다.", "그러나 어떤, 심지어는 가장 평범한 경험조차 더 자세히 살펴보는 것은 우리가 살고 있는 놀라운 다중 감각 세계를 보여 준다.", "일상의 식사를 하는 경험을 생각해 봐라.", "처음에는, 그것이 평범한 경험처럼 보일 수 있지만, 실제로 그것은 감각들의 융합이다.", "우리는 처음에는 눈으로 식사하지만, 또한 음식의 질감, 맛, 냄새와 같이 우리의 식사 경험에 영향을 미치는 수많은 감각 신호에도 노출된다.", "그리고 그것은 거기서 멈추지 않는다.", "심지어 우리가 식사하는 상황과, 음식(씹기)이나 우리가 식사에 사용하는 도구와의 상호 작용 둘 다에서 나오는 소리들도 우리의 식사 경험에 영향을 미친다."], "sum": "다중 감각 경험은 일상의 핵심이지만 당연하게 여겨진다. 평범한 식사조차 시각·질감·맛·냄새는 물론 주변 소리, 씹는 소리, 식사 도구까지 여러 감각이 융합된 경험이다.", "key": ["다중 감각 경험 = 일상의 핵심, 그러나 감각이 정상이면 당연시", "평범한 식사 = 감각들의 융합", "눈 → 질감·맛·냄새 → 분위기 소리, 씹는 소리, 식사 도구까지 영향"], "mem": [2, 4], "tp": [["the multisensory nature of everyday experiences such as eating", "식사 같은 일상 경험의 다중 감각적 본질"], ["how various senses combine to shape our eating experience", "다양한 감각이 결합해 식사 경험을 형성하는 방식"]], "tt": [["Eating with All Your Senses", "모든 감각으로 먹기"], ["A Meal Is More Than Taste", "식사는 맛 그 이상이다"]], "bl": [4, "a fusion of the senses", ["a matter of taste alone", "an ordinary visual event", "a purely social activity", "a habit we cannot change"]], "gr": [["we often take them for granted", "take ~ for granted: ~을 당연하게 여기다"], ["the remarkable multisensory world in which we live", "전치사 + 관계대명사"], ["Even the sounds that come both from A and B ... influence", "주어 the sounds(복수) → 동사 influence"]]}, {"src": "25년 10월 37번", "en": ["As children, the principle of opposites is foreign.", "Children perceive words and their meanings separately from each other.", "It is only in later development that we understood that individual words directly connect to one another.", "For many children, for instance, it is not clear that 'Right' is the opposite of 'Left'.", "A vivid example of this can be seen when children learn to ride a bicycle.", "If parents tell their child \"Don't go to the left,\" they will often find that the child will continue riding straight ahead and not automatically turn to the right.", "The same applies to the logical connection between 'Yes' and 'No' as perceived by parents.", "When we were children and were told, for example, \"No, don't eat with your hands,\" we were confused and didn't know what our parents expected from us.", "Our confusion was about whether we should continue eating or not and if so, how?", "Only later did we recognize the connection and understand that we should continue eating, but not with our hands but with a fork or a spoon."], "ko": ["어릴 때, 반대의 원리는 낯설다.", "아이들은 단어들과 그 의미들을 서로 분리해서 인식한다.", "우리가 개별 단어들이 직접적으로 서로 연결되어 있다는 것을 이해하게 되는 것은 나중의 발달 단계가 되어서이다.", "예를 들어, 많은 아이들에게, '오른쪽'이 '왼쪽'의 반대라는 것은 분명하지 않다.", "이것의 생생한 사례는 아이들이 자전거 타는 것을 배울 때 보여질 수 있다.", "부모들이 자녀에게, \"왼쪽으로 가지 마.\"라고 말하면, 부모는 아이가 곧장 앞으로 계속 가고 자동적으로 오른쪽으로 방향을 틀지 않는 것을 종종 보게 될 것이다.", "같은 원리가 부모가 인식하는 '예'와 '아니요' 사이의 논리적 관계에도 적용된다.", "우리가 아이였을 때, 예를 들어, \"안 돼, 손으로 먹지마.\"라는 말을 들었을 때, 우리는 혼란스러웠고, 우리 부모가 우리로부터 기대하는 것이 무엇인지 몰랐다.", "우리의 혼란은 계속 먹어야 하는 건지 아닌지, 만약 먹는다면 어떻게 해야 하지?에 대한 것이었다.", "나중에서야 우리는 그 연관성을 인식했고, 우리가 손이 아니라 포크나 숟가락으로 계속 먹어야 한다는 것을 이해하게 되었다."], "sum": "아이들에게 반대의 원리는 낯설다. 단어를 서로 분리해 인식하기 때문에 \"왼쪽으로 가지 마\"를 들어도 오른쪽으로 가지 않고, \"손으로 먹지 마\"에 혼란스러워한다. 단어 사이의 연결은 나중에 발달한다.", "key": ["아이들: 단어와 의미를 서로 분리해 인식 → 반대 개념(오른쪽/왼쪽)이 분명하지 않음", "자전거: \"왼쪽으로 가지 마\" → 오른쪽으로 꺾지 않고 계속 직진", "\"손으로 먹지 마\" → 혼란, 나중에야 '포크·숟가락으로 계속 먹기'로 이해"], "mem": [2, 3], "tp": [["children's difficulty in understanding the principle of opposites", "반대의 원리를 이해하는 데 있어 아이들의 어려움"], ["why negative instructions confuse young children", "부정형 지시가 어린아이를 혼란스럽게 하는 이유"]], "tt": [["For Kids, Left Is Not the Opposite of Right", "아이들에게 왼쪽은 오른쪽의 반대가 아니다"], ["\"Don't\" Doesn't Tell Children What to Do", "'하지 마'는 아이에게 무엇을 할지 알려 주지 않는다"]], "bl": [2, "perceive words and their meanings separately from each other", ["understand opposites from birth", "learn words faster than adults", "connect all words automatically", "ignore their parents' instructions"]], "gr": [["It is only in later development that we understood ~", "It is ~ that 강조구문"], ["it is not clear that 'Right' is the opposite of 'Left'", "가주어 it–진주어 that절"], ["Only later did we recognize ~", "Only + 부사구 문두 → 조동사 도치"]]}, {"src": "25년 10월 38번", "en": ["Humans are not the most social animal.", "Ants, bees, and termites put humanity to shame on many metrics of sociality.", "A wide variety of relatives live together with perfectly harmonious behavior and collectively care for their young.", "But while insect colonies are impressively social places, it's not our kind of social life.", "Bees always build hexagonal hives, ants march in lines, and termites move in zigzag formations.", "These patterns recur predictably because they are tightly programmed genetically and propelled pheromonally.", "We humans are more free, less tightly programmed genetically, so our social patterns can be more diverse and dynamic.", "Every group dances a slightly different dance, and these choreographies change across generations.", "We still think and act in ways that are in harmony with others around us, but it is through patterns that are more shaped by nurture, not just nature."], "ko": ["인간이 '가장' 사회적인 동물은 아니다.", "개미, 벌, 그리고 흰개미는 많은 사회성 측정 기준에서 인류를 부끄럽게 한다.", "매우 다양한 동족들이 완벽하게 조화로운 행동으로 함께 살고 집단적으로 그들의 어린 새끼들을 돌본다.", "그러나 곤충 군집들이 인상적으로 사회적인 장소인 반면, 그것은 '우리의' 사회생활의 종류가 아니다.", "벌들은 항상 육각형의 벌집을 짓고, 개미들은 줄지어 행진하며, 흰개미들은 지그재그 대형으로 움직인다.", "이러한 패턴들은 그것들이 유전적으로 긴밀하게 프로그램 되어 있으며 페로몬에 의해 추진되기 때문에 예측할 수 있게 반복된다.", "우리 인간은 더 자유롭고, 유전적으로 덜 긴밀하게 프로그램 되어 있어서 우리의 사회적 패턴들은 더 다양하고 역동적일 수 있다.", "모든 집단은 약간 다른 춤을 추는데 이러한 안무들은 세대에 걸쳐 변한다.", "우리는 여전히 우리 주변의 다른 사람들과 조화를 이루는 방식으로 생각하고 행동하지만, 그것은 단지 본성만이 아니라 양육에 의해 더 많이 형성되는 패턴들을 통해서이다."], "sum": "곤충 사회는 유전적으로 프로그램된 고정 패턴으로 움직이지만, 인간은 유전적으로 덜 묶여 있어 사회적 패턴이 더 다양하고 역동적이며, 본성뿐 아니라 양육(nurture)에 의해 형성된다.", "key": ["개미·벌·흰개미 = 많은 사회성 기준에서 인간보다 앞섬", "그러나 패턴(육각형 벌집·줄·지그재그) = 유전·페로몬으로 고정, 예측 가능", "인간 = 덜 프로그램됨 → 다양·역동적, 세대마다 변화, 양육으로 형성"], "mem": [7, 9], "tp": [["the flexible, nurture-shaped nature of human social life", "유연하고 양육으로 형성되는 인간 사회생활의 특성"], ["how human sociality differs from genetically programmed insect societies", "인간의 사회성이 유전적으로 프로그램된 곤충 사회와 다른 점"]], "tt": [["Not the Most Social, but the Most Flexible", "가장 사회적이진 않지만 가장 유연한"], ["Every Group Dances Its Own Dance", "모든 집단은 자신만의 춤을 춘다"]], "bl": [7, "less tightly programmed genetically", ["more strictly controlled by pheromones", "more predictable than insects", "less able to cooperate", "completely free from nature"]], "gr": [["put humanity to shame", "put ~ to shame: ~을 무색하게 하다"], ["because they are tightly programmed genetically and propelled pheromonally", "수동태 병렬"], ["it is through patterns that are more shaped by nurture", "It is ~ that 강조 + 주격 관계대명사"]]}, {"src": "25년 10월 39번", "en": ["Those who purchase the goods of a company are called customers.", "Individuals who purchase goods for personal use are called consumers: beings who consume.", "Therefore, companies have invented multiple ways to ensure that their customers consume the produced items in larger and larger quantities and more and more frequently.", "Those who sell food have an easy time, for food is literally consumed, so there is always a need to purchase new food.", "But with more permanent things, companies must invent reasons for their customers to continue to consume them.", "One approach is to make the stuff that people already have outdated by convincing them that it is no longer fashionable.", "The entire fashion industry is built to convince people that fashion matters, so they must purchase new clothing, even though the old is still perfectly functionable.", "Fashion today extends to far more things than clothes: automobiles, mobile phones, computers ―", "the list is extended indefinitely, limited only by the limits of the creative minds of the marketing divisions of companies."], "ko": ["어떤 회사의 상품을 구매하는 사람들은 고객이라 불린다.", "개인적인 용도로 상품을 구매하는 사람들은 소비자, 즉 소비하는 존재라 불린다.", "따라서, 기업들은 그들의 고객이 생산된 물품을 반드시 점점 더 많이 점점 더 자주 소비하게 하기 위한 다양한 방법들을 고안해 왔다.", "음식을 판매하는 사람들은 수월한 편인데, 왜냐하면 음식은 말 그대로 소비되므로, 새로운 음식을 구매할 필요는 항상 있기 때문이다.", "그러나 보다 영구적인 물건의 경우, 기업들은 고객이 그것들을 계속 소비할 이유를 만들어 내야 한다.", "한 가지 접근법은 사람들이 이미 가지고 있는 물건이 더 이상 유행하지 않는다고 설득하여 그것을 구식이 되게 하는 것이다.", "전체 패션 산업은 기존 옷이 여전히 완벽하게 기능하더라도, 유행이 중요하고 그래서 그들이 새 옷을 사야 한다고 사람들을 설득하기 위해 만들어져 있다.", "오늘날 유행은 옷을 넘어 자동차, 휴대 전화, 컴퓨터 등 훨씬 많은 것들로 확장된다.", "그 목록은 끝없이 확장되며, 다만 기업에 속한 마케팅 부서의 창의적 사고의 한계에 의해서만 제한될 뿐이다."], "sum": "기업은 고객이 더 많이, 더 자주 소비하도록 여러 방법을 고안한다. 오래 쓰는 물건은 '유행이 지났다'고 설득해 멀쩡한 물건을 구식으로 만들며, 이는 옷을 넘어 자동차·휴대폰·컴퓨터로 끝없이 확장된다.", "key": ["소비자 = 소비하는 존재 → 기업은 더 많이·더 자주 소비하게 함", "음식은 쉽지만, 영구적인 물건은 계속 소비할 이유를 '만들어야' 함", "유행이 지났다고 설득 → 멀쩡한 물건도 구식화 (옷 → 자동차·휴대폰·컴퓨터)"], "mem": [5, 6], "tp": [["how companies use fashion to make consumers keep buying", "기업이 소비자가 계속 사도록 유행을 이용하는 방식"], ["creating artificial outdatedness to drive consumption", "소비를 이끌기 위해 인위적으로 구식을 만들어 내기"]], "tt": [["Out of Style, Not Out of Use", "쓸모가 아니라 유행이 다했을 뿐"], ["How Fashion Keeps Us Buying", "유행은 어떻게 우리를 계속 사게 만드는가"]], "bl": [6, "make the stuff that people already have outdated", ["make products last longer", "lower the price of old products", "repair broken items for free", "produce fewer new products"]], "gr": [["Those who sell food have an easy time", "Those who ~: ~하는 사람들"], ["for food is literally consumed", "접속사 for: 왜냐하면"], ["make the stuff ... outdated by convincing them that ~", "make O C(형용사) / convince O that절"]]}, {"src": "25년 10월 40번", "en": ["Kivetz, Urminsky, and Zheng partnered with a cafe to test the motivating effect of illusory progress in an experiment.", "Customers received a reward card that offered one free coffee after they'd bought ten.", "While half of the customers received a card with ten open slots, the other half got a card with twelve open slots.", "Yet the twelve-slot card had two preexisting \"bonus\" stamps, so, strictly speaking, these were identical reward programs.", "Every customer who got a card needed to make ten coffee purchases (and collect ten stamps) to get their free coffee.", "But the appeal of the free stamps was high.", "People who thought they'd gotten a head start came back to the cafe more often, filling in their reward card more quickly than the others.", "When the card came with two out of twelve slots already filled, it felt to customers like they were already 16 percent finished with the goal before they'd even started.", "Believing they were closer to the reward, they were more motivated to reach the finish line."], "ko": ["Kivetz, Urminsky, Zheng은 착각된 진전이 주는 동기 부여 효과를 실험에서 시험해 보기 위해 한 카페와 협력했다.", "고객들은 열 잔을 산 후에 무료 커피 한 잔을 제공하는 보상 카드를 받았다.", "고객들 중 절반은 열 개의 빈칸이 있는 카드를 받은 반면에, 나머지 절반은 열두 개의 빈칸이 있는 카드를 받았다.", "하지만 열두 칸짜리의 카드에는 이미 찍힌 두 개의 '보너스' 도장이 있어서, 엄밀히 말하면, 이것들은 동일한 보상 프로그램이었다.", "카드를 받은 모든 고객은 무료 커피를 받기 위해 열 잔의 커피를 구매해야 (그리고 도장 열 개를 모아야) 했다.", "하지만 무료 도장의 매력은 컸다.", "자신이 앞선 출발을 했다고 생각한 사람들은 카페에 더 자주 돌아왔고, 다른 사람들보다 더 빨리 그들의 보상 카드를 채웠다.", "열두 칸 중 두 칸이 이미 채워진 채로 카드가 손에 들어왔을 때, 그것은 고객들에게 시작도 하기 전에 이미 목표의 16퍼센트를 끝낸 것처럼 느껴졌다.", "자신들이 보상에 더 가까워졌다고 믿었기 때문에, 그들은 결승선에 도달하는 데 더 큰 동기를 부여받았다."], "sum": "카페 실험에서 12칸 중 2칸이 미리 찍힌 카드를 받은 고객은 10칸 카드와 실제 조건이 같았음에도 더 자주 방문해 더 빨리 카드를 채웠다. 목표에 가까워졌다는 착각(착각된 진전)이 동기를 높인다.", "key": ["실험: 10칸 카드 vs 12칸(보너스 도장 2개) 카드 → 실제로는 둘 다 10잔 구매 (동일 조건)", "보너스 카드 고객: 더 자주 방문, 더 빨리 카드 채움", "이미 16% 진행한 느낌 → 보상에 가깝다고 믿음 → 동기↑"], "mem": [7, 9], "tp": [["the motivating effect of illusory progress toward a goal", "목표를 향한 착각된 진전의 동기 부여 효과"], ["how a feeling of a head start increases motivation", "앞서 출발했다는 느낌이 동기를 높이는 방식"]], "tt": [["A Head Start Makes You Run Faster", "앞선 출발이 더 빨리 달리게 한다"], ["Two Free Stamps, Big Motivation", "무료 도장 두 개, 큰 동기"]], "bl": [9, "Believing they were closer to the reward", ["Realizing the cards were identical", "Feeling tired of collecting stamps", "Knowing the coffee was expensive", "Thinking the reward was too small"]], "gr": [["after they'd bought ten", "they'd = they had (과거완료)"], ["While half of the customers received ..., the other half got ~", "while: ~인 반면"], ["Believing they were closer to the reward, they were ~", "이유의 분사구문"]]}];

 const blank=en.replace(p.bl[1],'_____');const front=ST.fcMode==='ko'?esc(ko):ST.fcMode==='blank'?esc(blank===en?en.split(' ').map((w,i)=>i%4===2?'____':w).join(' '):blank):esc(en);
 const back=ST.fcMode==='en'?esc(ko):esc(en);const nk=L.filter(x=>known[x.p.i+'-'+x.m]).length;
 return `<div class="chips">${[['all','전체'],['24','24년 10월'],['25','25년 10월']].map(([k2,l])=>`<button class="chip ${ST.fcR===k2?'on':''}" onclick="ST.fcR='${k2}';ST.fcI=0;render()">${l}</button>`).join('')}</div>
 <div class="chips">${[['ko','한→영'],['en','영→한'],['blank','빈칸 채우기']].map(([k2,l])=>`<button class="chip ${ST.fcMode===k2?'on':''}" onclick="ST.fcMode='${k2}';render()">${l}</button>`).join('')}</div>
 <div class="qh"><span>${p.src} · ${'❶❷❸❹❺❻❼❽❾❿'[c.m-1]}번 문장</span><span>${ST.fcI+1}/${L.length} · 외움 ${nk}</span></div>
 <div class="card fc" onclick="this.querySelector('.a').hidden=!this.querySelector('.a').hidden"><div class="src">${esc(p.tt[0][1])}</div><div class="q">${front}</div><div class="a" hidden>${back}</div><div class="tap">눌러서 정답 보기</div></div>
 <div class="row"><button class="btn g" style="flex:1" onclick="fcMove(-1)">‹ 이전</button><button class="btn ${known[k]?'':'g'}" style="flex:1" onclick="fcKnow('${k}')">${known[k]?'✓ 외웠어요':'외웠어요'}</button><button class="btn g" style="flex:1" onclick="fcMove(1)">다음 ›</button></div>
 <div class="row" style="margin-top:8px"><button class="btn g w" onclick="fcNext()">아직 못 외운 문장만 보기 ›</button></div>`}
function fcMove(d){const n=fcList().length;ST.fcI=(ST.fcI+d+n)%n;render()}
function fcKnow(k){if(known[k])delete known[k];else known[k]=1;LS.set('known',known);render()}
function fcNext(){const L=fcList();for(let s=1;s<=L.length;s++){const j=(ST.fcI+s)%L.length;if(!known[L[j].p.i+'-'+L[j].m]){ST.fcI=j;render();return}}alert('모든 문장을 외웠어요! 🎉')}

/* ---------- 오답 ---------- */
function vWrong(){if(!wrong.length)return '<div class="empty">아직 틀린 문제가 없어요.<br>문제를 풀면 틀린 지문이 여기에 모입니다.</div>';
 return `<div class="row" style="margin-bottom:10px"><button class="btn" style="flex:1" onclick="retryWrong()">틀린 문제 다시 풀기 (${wrong.length})</button><button class="btn g" onclick="if(confirm('오답 노트를 비울까요?')){wrong.length=0;LS.set('wrong',wrong);render()}">비우기</button></div>
 <div class="list">${wrong.map(w=>{const p=D[w.p];return `<div class="card" onclick="openP(${p.i});go('list',1)"><div class="nb">${p.no}<small>${p.yr}년</small></div><div class="li"><b>${esc(p.tt[0][1])}</b><span><span class="tg">고${w.lv}</span>${w.type}</span></div></div>`}).join('')}</div>`}
function retryWrong(){const map={'주제':'topic','제목':'title','요지':'gist','빈칸':'blank','순서':'order','삽입':'insert','서술형 배열':'scramble'};
 const qs=wrong.map(w=>{const p=D[w.p],t=map[w.type];const q=t==='blank'?G.blank(p,w.lv):G[t](p);if(q)q.lv=w.lv;return q}).filter(Boolean);
 wrong.length=0;LS.set('wrong',wrong);ST.quiz={qs:rnd(qs),k:0,sc:0,sel:null,tok:[]};ST.tab='quiz';render()}

/* ---------- 공통 ---------- */
function go(t,keep){ST.tab=t;if(!keep&&t==='list')ST.view=null;render();scrollTo(0,0)}
function render(){const T=[['list','📚','지문'],['quiz','✍️','문제'],['fc','⭐','암기'],['wrong','📝','오답']];
 $('#nav').innerHTML=T.map(([k,i,l])=>`<button class="${ST.tab===k?'on':''}" onclick="go('${k}')"><b>${i}</b>${l}${k==='wrong'&&wrong.length?` (${wrong.length})`:''}</button>`).join('');
 $('#app').innerHTML=ST.tab==='list'?vList():ST.tab==='quiz'?vQuiz():ST.tab==='fc'?vFC():vWrong()}
render();
</script>
</body>
</html>
